name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Annuler les workflows en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------
  # Tests et linting
  # -----------------------------------------------------------------------------
  test:
    name: Tests et Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx black ruff mypy

      - name: Vérifier le formatage du code avec Black
        run: |
          black --check src/ tests/ || true

      - name: Vérifier le code avec Ruff
        run: |
          ruff check src/ tests/ || true

      - name: Vérifier les types avec mypy
        run: |
          mypy src/ --ignore-missing-imports --allow-incomplete-defs || true

      - name: Exécuter les tests unitaires
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml || true

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
