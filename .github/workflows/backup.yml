name: Sauvegarde automatique

on:
  schedule:
    # Tous les jours à 2h du matin
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Sauvegarde de la base de données
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer une sauvegarde
        run: |
          echo "Sauvegarde automatique déclenchée"
          # Dans une vraie configuration, vous auriez:
          # 1. Un serveur avec SSH configuré
          # 2. Les secrets SSH configureés dans GitHub
          # 3. Un script de sauvegarde sur le serveur
          echo "Pour activer les sauvegardes automatiques, configurez:"
          echo "1. Un serveur avec Docker installé"
          echo "2. Les secrets SSH dans les paramètres du dépôt"
          echo "3. Le workflow pour se connecter à votre serveur"
