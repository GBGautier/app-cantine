<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGRS</title>
<script src="/static/vendor/jspdf-4.2.1.umd.min.js"></script>
<script src="/static/vendor/jspdf-autotable-5.0.9.min.js"></script>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="auth" hidden></div>
<div id="shell" hidden>
  <header><div class="wrap">
    <img class="logo" src="/static/img/logo.png" alt="" width="39" height="40"><b class="brand">CGRS</b>
    <nav id="nav"></nav>
    <div id="me"></div>
  </div></header>
  <main><div class="wrap" id="app"></div></main>
</div>
<div id="toast"></div>

<script src="/static/js/base.js"></script>
<script src="/static/js/composants.js"></script>
<script src="/static/js/identification.js"></script>
<script src="/static/js/export-pdf-statistiques.js"></script>
<script src="/static/js/statistiques.js"></script>
<script src="/static/js/fournisseurs.js"></script>
<script src="/static/js/produits.js"></script>
<script src="/static/js/receptions.js"></script>
<script src="/static/js/repas.js"></script>
<script src="/static/js/recettes.js"></script>
<script src="/static/js/stocks.js"></script>
<script src="/static/js/parametres.js"></script>
<script src="/static/js/grammages-donnees.js"></script>
<script src="/static/js/grammages.js"></script>
<script src="/static/js/navigation.js"></script>
<script src="/static/js/demarrage.js"></script>

<div id="pdf-viewer" hidden style="position:fixed;inset:0;z-index:1000;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto">
  <div style="background:var(--card);border-radius:14px;width:100%;max-width:1040px;height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden">
    <div style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)">
      <strong id="pdf-title"></strong>
      <div style="display:flex;gap:10px">
        <button onclick="closePdf()">✕ Fermer</button>
      </div>
    </div>
    <iframe id="pdf-frame" style="flex:1;border:0"></iframe>
  </div>
</div>
<script src="/static/js/visionneuse-pdf.js"></script>



</body>
</html>
