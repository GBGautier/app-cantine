<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGRS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2a24;--mute:#6b766f;--line:#e3e1d8;--acc:#2f6b4f;--acc2:#e9f2ec;--warn:#b4532a;--warnbg:#fbeae1;--bar:#6fa585}
@media (prefers-color-scheme:dark){:root{--bg:#161a18;--card:#1f2522;--ink:#e8ece9;--mute:#9aa7a0;--line:#313a35;--acc:#6fb08f;--acc2:#24332b;--warn:#e08a5f;--warnbg:#3a2a22;--bar:#4f8d6d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--acc)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-height:54px}
.brand{font-size:18px;letter-spacing:.04em}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{padding:8px 12px;border-radius:8px;color:var(--mute);text-decoration:none;font-weight:500}
nav a.on{background:var(--acc2);color:var(--acc)}
#me{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px}
main{padding:20px 0 60px}
h2{margin:0 0 14px;font-size:20px}
h3{margin:0 0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--mute);display:block}
.kpi strong{font-size:26px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.bar{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar .t{background:var(--acc2);border-radius:4px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--bar)}
.bar span:last-child{text-align:right;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
th,th.n{text-align:left}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
td.n,th.n{text-align:right}
.tablewrap{overflow:auto;max-height:calc(100vh - 210px)}
.modal .tablewrap{max-height:50vh}
.card.tablewrap{padding-top:0;padding-bottom:0}
/* Formulaire Recette : la colonne « Qté à servir » est masquée (calculs conservés) */
.rec-items-tbl th:nth-child(4),.rec-items-tbl td:nth-child(4){display:none}
th{position:sticky;top:0;z-index:2;background:var(--card);box-shadow:0 1px 0 var(--line)}
button,.btn{font:inherit;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:disabled{opacity:.5;cursor:not-allowed}
button.p,.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
label.btn{margin:0;font-size:15px}
button.d{color:var(--warn)}
button.s{height:auto;padding:4px 9px;font-size:13px}
.icon-btn{height:auto;padding:4px 7px;font-size:15px;min-width:0;border:none;background:transparent;color:var(--mute);cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.icon-btn:hover{background:var(--acc2);color:var(--acc)}
.icon-btn.d:hover{background:var(--warnbg);color:var(--warn)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--acc2)}
input,select,textarea{font:inherit;padding:0 9px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{height:auto;padding:7px 9px}
input[type=checkbox]{width:auto;height:auto}
input:disabled,select:disabled,textarea:disabled{opacity:.75;cursor:default}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.f{display:grid;gap:12px;align-items:end;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.f>div{display:flex;flex-direction:column;justify-content:flex-end}
.f>.full{display:block}
.filebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filebox .fname{color:var(--mute);font-size:13px}
.filebox button.s{height:32px;padding:0 12px;align-self:center}
.f .full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.row>div{min-width:140px}
.tools{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tools h2{margin:0}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl input:not([type=checkbox]),.ctl select{width:auto;min-width:150px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.pill.w{background:var(--warnbg);color:var(--warn)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;margin:0 10px 6px 0;font-size:14px;line-height:16px;color:var(--ink);cursor:pointer}
input[type=checkbox]{height:16px;width:16px;margin:0;flex:none;accent-color:var(--acc);vertical-align:-3px}   /* alignés avec le texte, partout */
.checks{display:flex;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:20}
.modal>div{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:1040px}
.modal h2{margin-bottom:16px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mute{color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
td input,td select{height:32px;min-width:70px}
small.hint{display:block;color:var(--warn);font-size:12px;margin-top:2px}
.err{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-top:12px}
.note{background:var(--acc2);color:var(--ink);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.note.w{background:var(--warnbg)}
.authbox{max-width:380px;margin:12vh auto;padding:0 16px}
.authbox .card{padding:24px}
.authbox label{margin-top:12px}
.chart svg{width:100%;height:auto;display:block}
.neg{color:var(--warn);font-weight:600}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;max-width:92%}
#toast div{background:var(--acc);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 4px 16px #0004}
</style>
</head>
<body>
<div id="auth" hidden></div>
<div id="shell" hidden>
  <header><div class="wrap">
    <b class="brand">CGRS</b>
    <nav id="nav"></nav>
    <div id="me"></div>
  </div></header>
  <main><div class="wrap" id="app"></div></main>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'value') e.value = v ?? '';
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const eur = v => v == null ? '—' : Number(v).toLocaleString('fr-FR', {style: 'currency', currency: 'EUR'});
const num = v => v == null ? '—' : Number(v).toLocaleString('fr-FR', {maximumFractionDigits: 3});
const pctf = v => v == null ? '—' : Number(v).toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' %';
const dfr = d => d ? d.split('-').reverse().join('/') : '—';
const today = () => new Date().toISOString().slice(0, 10);
const numOrNull = v => v === '' || v == null ? null : Number(v);
const cmp = (a, b) => (a ?? '').toString().localeCompare((b ?? '').toString(), 'fr', {numeric: true, sensitivity: 'base'});
const prettyFile = n => (n || '').replace(/^(?:fiche_)?[0-9a-f]{12}_/, '');
const fileUrl = n => '/api/files/' + encodeURIComponent(n);
const fileLink = (n, text) => n ? h('a', {href: fileUrl(n),title: 'Ouvrir le fichier',onclick: e => { e.stopPropagation(); e.preventDefault(); openPdf(fileUrl(n), prettyFile(n)); }}, text || prettyFile(n)) : null;
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const DAY_LABELS = {lun: 'Lun', mar: 'Mar', mer: 'Mer', jeu: 'Jeu', ven: 'Ven', sam: 'Sam', dim: 'Dim'};
const UGRP = {kg: 'kg', g: 'g', l: 'l', litre: 'l', litres: 'l', ml: 'ml', 'unité': 'u', 'unités': 'u', 'pièce': 'u', 'pièces': 'u', u: 'u', pc: 'u'};
const ukey = u => { u = (u || '').trim().toLowerCase(); return UGRP[u] ?? u; };
const sameUnit = (a, b) => !a || !b || ukey(a) === ukey(b);

const state = {user: null, meta: null};
const canWrite = () => state.user && ['admin', 'editor'].includes(state.user.role);
const isAdmin = () => state.user && state.user.role === 'admin';
const isStatsOnly = () => state.user && state.user.role === 'stats';

function toast(msg, ms = 7000) {
  const t = h('div', {}, msg);
  $('#toast').append(t);
  setTimeout(() => t.remove(), ms);
}
function busy(on) { document.body.style.cursor = on ? 'progress' : ''; }

async function api(path, opts = {}) {
  const init = {method: opts.method || 'GET', headers: {'X-Requested-With': 'cgrs'}, credentials: 'same-origin'};
  if (opts.body instanceof FormData) init.body = opts.body;
  else if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  const r = await fetch('/api' + path, init);
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = Array.isArray(j.detail) ? j.detail.map(d => d.msg).join(' ; ') : (j.detail || m); } catch {}
    if (r.status === 401 && !opts.noRedirect) { state.user = null; showAuth(false); }
    const e = new Error(m); e.status = r.status; throw e;
  }
  return r.json();
}

/* ---------- composants ---------- */
function field(label, input, cls = '') {
  if (input && input.type === 'checkbox')   // case à cocher : libellé à gauche, centré verticalement avec la case
    return h('div', {class: cls}, h('label', {class: 'chk', style: 'margin:0'}, label, input));
  return h('div', {class: cls}, h('label', {}, label), input);
}
function select(options, value, attrs = {}) {
  const s = h('select', attrs);
  for (const [v, l] of options) s.append(h('option', {value: v, selected: String(v) === String(value ?? '')}, l));
  return s;
}
function checkGroup(options, selected) {
  const sel = new Set(selected || []);
  const boxes = options.map(([v, l]) => h('input', {type: 'checkbox', value: v, checked: sel.has(v)}));
  const wrap = h('div', {class: 'checks'}, options.map(([v, l], i) => h('label', {class: 'chk'}, l, boxes[i])));
  wrap.values = () => boxes.filter(b => b.checked).map(b => b.value);
  return wrap;
}
function modal(title, body, onSave, opts = {}) {
  const m = h('div', {class: 'modal'});
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); if (opts.onClose) opts.onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const err = h('div', {class: 'err', style: 'display:none'});
  if (!onSave) body.querySelectorAll('input,select,textarea,button:not([data-nolock])').forEach(e => { e.disabled = true; });
  const doSave = onSave || opts.saveHandler;   // sauvegarde possible même en consultation : « Modifier » déverrouille sans recharger
  const mkSave = () => h('button', {class: 'p', onclick: async ev => {
    ev.target.disabled = true;
    try { await doSave(); m.remove(); document.removeEventListener('keydown', onKey); render(); if (opts.onClose) opts.onClose(); }
    catch (e) { err.textContent = e.message; err.style.display = 'block'; ev.target.disabled = false; }
  }}, opts.saveLabel || 'Enregistrer');
  const save = onSave ? mkSave() : null;
  const titleH = h('h2', {}, title);
  const actions = h('div', {class: 'actions'}, h('button', {onclick: close}, onSave ? 'Annuler' : 'Fermer'));
  const editBtn = (!onSave && doSave) ? h('button', {class: 'p', onclick: () => {
    // bascule en édition SANS recharger : la fiche affichée est simplement déverrouillée
    body.querySelectorAll('input,select,textarea,button:not([data-nolock])').forEach(e => { e.disabled = false; });
    body.querySelectorAll('[data-viewhidden]').forEach(e => { e.style.display = e.getAttribute('data-viewhidden') || ''; });
    if (opts.editTitle) titleH.textContent = opts.editTitle;
    opts.viewOnly = false;                    // le formulaire voit le changement (même objet d'options)
    if (opts.onSwitch) opts.onSwitch();
    editBtn.style.display = 'none';
    actions.append(mkSave());
  }}, '✏️ Modifier') : null;
  if (editBtn) actions.append(editBtn);
  if (save) actions.append(save);
  m.append(h('div', {}, titleH, body, err, actions));
  document.body.append(m);
  return m;
}
function bars(items) {
  if (!items.length) return h('div', {class: 'empty'}, 'Pas de données');
  const max = Math.max(...items.map(i => i.pct), 1);
  return items.map(i => h('div', {class: 'bar', title: i.amount != null ? eur(i.amount) : null},
    h('span', {}, i.label),
    h('div', {class: 't'}, h('i', {style: `width:${100 * i.pct / max}%`})),
    h('span', {}, i.pct + ' %')));
}
function kpi(label, value, sub) { return h('div', {class: 'kpi'}, h('small', {}, label), h('strong', {}, value), sub ? h('small', {}, sub) : null); }
function chart(points, fmt, bars = false, refLine = null) {
  const box = h('div', {class: 'chart'});
  if (!points.length) { box.append(h('div', {class: 'empty'}, 'Pas encore de données')); return box; }
  const W = 640, H = 170, pl = 56, pr = 14, pt = 12, pb = 26;
  let lo = Math.min(...points.map(p => p.y)), hi = Math.max(...points.map(p => p.y));
  if (bars) lo = Math.min(0, lo);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; if (!bars || lo < 0) lo -= pad; hi += pad;
  const n = points.length;
  const X = bars ? (i => pl + (i + 0.5) * (W - pl - pr) / n) : (i => pl + (n === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n - 1)));
  const Y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/>` +
    `<text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--mute)">${esc(fmt(v))}</text>`).join('');
  const line = !bars && n > 1 ? `<polyline fill="none" stroke-width="2" style="stroke:var(--acc)" points="${points.map((p, i) => X(i) + ',' + Y(p.y)).join(' ')}"/>` : '';
  const bw = Math.max(2, Math.min(34, (W - pl - pr) / Math.max(n, 1) * 0.7));
  const barsSvg = points.map((p, i) => `<rect x="${X(i) - bw / 2}" y="${Math.min(Y(p.y), Y(0))}" width="${bw}" height="${Math.abs(Y(0) - Y(p.y))}" rx="2" style="fill:var(--acc)"><title>${esc(p.tip)}</title></rect>`).join('');
  const dots = points.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" style="fill:var(--acc)"><title>${esc(p.tip)}</title></circle>`).join('');
  const xl = `<text x="${X(0)}" y="${H - 6}" text-anchor="${n === 1 ? 'middle' : 'start'}" font-size="11" style="fill:var(--mute)">${esc(dfr(points[0].x))}</text>` +
    (n > 1 ? `<text x="${X(n - 1)}" y="${H - 6}" text-anchor="end" font-size="11" style="fill:var(--mute)">${esc(dfr(points[n - 1].x))}</text>` : '');
  // ligne de référence horizontale (rouge, pointillée) avec son étiquette
  const rl = refLine != null && refLine > lo && refLine < hi
    ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(refLine)}" y2="${Y(refLine)}" stroke-width="2" stroke-dasharray="6 4" style="stroke:#d33"/>` +
      `<text x="${W - pr}" y="${Y(refLine) - 5}" text-anchor="end" font-size="11" style="fill:#d33">${esc(fmt(refLine))}</text>` : '';
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${rl}${bars ? barsSvg : line + dots}${xl}</svg>`;
  return box;
}
function confirmDel(msg, fn) { return async () => { if (confirm(msg)) { try { await fn(); render(); } catch (e) { alert(e.message); } } }; }

/* ---------- identification ---------- */
function showAuth(setup) {
  $('#shell').hidden = true;
  const box = $('#auth');
  box.hidden = false;
  box.replaceChildren();
  const u = h('input', {type: 'text', autocomplete: 'username', autofocus: true});
  const p = h('input', {type: 'password', autocomplete: setup ? 'new-password' : 'current-password'});
  const p2 = h('input', {type: 'password', autocomplete: 'new-password'});
  const err = h('div', {class: 'err', style: 'display:none'});
  const go = async () => {
    err.style.display = 'none';
    try {
      if (setup && p.value !== p2.value) throw new Error('Les deux mots de passe ne correspondent pas');
      const r = await api(setup ? '/auth/setup' : '/auth/login', {method: 'POST', body: {username: u.value, password: p.value}, noRedirect: true});
      state.user = r.user;
      location.hash = '';
      await enter();
    } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  };
  box.append(h('div', {class: 'authbox'}, h('div', {class: 'card'},
    h('h2', {style: 'text-align:center'}, 'CGRS'),
    setup ? h('p', {class: 'mute'}, 'Première utilisation : créez le compte administrateur. Vous pourrez ensuite ajouter d\'autres utilisateurs dans Paramètres.') : null,
    h('label', {}, 'Identifiant'), u,
    h('label', {}, 'Mot de passe' + (setup ? ' (8 caractères minimum)' : '')), p,
    setup ? [h('label', {}, 'Confirmer le mot de passe'), p2] : null,
    err,
    h('div', {class: 'actions'}, h('button', {class: 'p', onclick: go}, setup ? 'Créer le compte' : 'Se connecter')))));
  for (const i of [u, p, p2]) i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  u.focus();
}

function passwordForm() {
  const i = {cur: h('input', {type: 'password', autocomplete: 'current-password'}), n: h('input', {type: 'password', autocomplete: 'new-password'}), n2: h('input', {type: 'password', autocomplete: 'new-password'})};
  modal('Changer mon mot de passe', h('div', {class: 'f'},
    field('Mot de passe actuel', i.cur, 'full'), field('Nouveau mot de passe (8 caractères minimum)', i.n), field('Confirmer', i.n2)), async () => {
    if (i.n.value !== i.n2.value) throw new Error('Les deux mots de passe ne correspondent pas');
    await api('/auth/password', {method: 'POST', body: {current: i.cur.value, new: i.n.value}});
    toast('Mot de passe modifié');
  });
}

/* ---------- Export PDF Statistiques ---------- */
function exportStatsPdf(s, f) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: 'portrait', unit: 'mm', format: 'a4'});
  const hid = s.prices_hidden;

  // Fonctions de formatage compatibles PDF (Helvetica ne supporte pas l'espace fine
  // insécable U+202F ni le non-breaking space U+00A0 utilisés par toLocaleString fr-FR)
  const pdfNum = v => {
    if (v == null) return '—';
    const n = Number(v);
    const parts = Math.abs(n).toFixed(3).replace(/\.?0+$/, '').split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (n < 0 ? '-' : '') + parts.join(',');
  };
  const pdfEur = v => {
    if (v == null) return '—';
    const n = Number(v);
    const parts = Math.abs(n).toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (n < 0 ? '-' : '') + parts.join(',') + ' EUR';
  };
  const pdfPct = v => v == null ? '—' : pdfNum(v) + ' %';
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 14;
  let y = margin;

  // Couleurs
  const GREEN = [47, 107, 79];
  const MUTE = [107, 118, 111];
  const INK = [31, 42, 36];

  // Titre
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(...GREEN);
  doc.text('CGRS — Statistiques des achats', margin, y);
  y += 7;

  // Période
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(...MUTE);
  const periodeLabel = (f.from || f.to)
    ? 'Période : ' + (f.from ? 'du ' + dfr(f.from) : '') + (f.from && f.to ? ' ' : '') + (f.to ? 'au ' + dfr(f.to) : '')
    : 'Toutes les données';
  doc.text(periodeLabel, margin, y);
  const dateGen = 'Généré le ' + new Date().toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  doc.text(dateGen, pageW - margin, y, {align: 'right'});
  y += 8;

  // Ligne séparatrice
  doc.setDrawColor(...GREEN);
  doc.setLineWidth(0.5);
  doc.line(margin, y, pageW - margin, y);
  y += 6;

  // KPIs
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(...INK);
  doc.text('Indicateurs clés', margin, y);
  y += 5;

  const kpis = [];
  if (!hid) kpis.push(['Achats HT', pdfEur(s.total_ht)]);
  if (!hid) kpis.push(['Prix / repas (HT)', s.price_per_meal == null ? '—' : pdfEur(s.price_per_meal)]);
  kpis.push(['Repas', String(s.meals)]);
  kpis.push(['Convives', String(s.guests)]);
  kpis.push(['% bio', pdfPct(s.pct_bio)]);
  kpis.push(['% EGalim', pdfPct(s.pct_egalim)]);
  kpis.push(['% local', pdfPct(s.pct_local)]);
  kpis.push(['% direct producteur', pdfPct(s.pct_direct)]);

  // KPIs en grille (2 colonnes)
  const colW = (pageW - 2 * margin) / 2;
  kpis.forEach(([label, value], i) => {
    const cx = margin + (i % 2) * colW;
    const cy = y + Math.floor(i / 2) * 10;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(...MUTE);
    doc.text(label, cx, cy);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.setTextColor(...INK);
    doc.text(value, cx, cy + 5);
  });
  y += Math.ceil(kpis.length / 2) * 10 + 4;

  // Engagements
  const allCommitments = s.commitments || [];
  const engGroups = [
    {title: 'Engagements du marché', items: allCommitments.filter(c => c.level !== 'par')},
  ];
  for (const {title, items} of engGroups) {
    if (!items.length) continue;
    if (y > 240) { doc.addPage(); y = margin; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...INK);
    doc.text(title, margin, y);
    y += 3;
    doc.autoTable({
      startY: y,
      margin: {left: margin, right: margin},
      styles: {fontSize: 9, cellPadding: 2, textColor: INK},
      headStyles: {fillColor: GREEN, textColor: [255,255,255], fontStyle: 'bold', fontSize: 8},
      alternateRowStyles: {fillColor: [240, 245, 242]},
      head: [['Engagement', 'Indicateur', 'Cible', 'Réalisé', 'Écart', 'Statut']],
      body: items.map(c => {
        const metrics = c.metrics && c.metrics.length ? c.metrics : (c.metric ? [c.metric] : []);
        const unit = metrics.includes('price_per_meal') ? ' €' : ' %';
        const gap = c.actual == null ? null : Math.round((c.actual - c.target) * 100) / 100;
        return [
          c.label,
          c.metric_label || metrics.join(' + '),
          (c.mode === 'max' ? '<= ' : '>= ') + pdfNum(c.target) + unit,
          c.actual == null ? '—' : pdfNum(c.actual) + unit,
          gap == null ? '—' : (gap > 0 ? '+' : '') + pdfNum(gap),
          c.status === 'ok' ? 'Respecté' : c.status === 'ko' ? 'Non atteint' : '—'
        ];
      }),
      didParseCell(data) {
        if (data.section === 'body' && data.column.index === 5) {
          const v = data.cell.raw;
          if (v === 'Respecté') data.cell.styles.textColor = [47, 107, 79];
          else if (v === 'Non atteint') data.cell.styles.textColor = [180, 83, 42];
        }
      }
    });
    y = doc.lastAutoTable.finalY + 6;
  }

  // Répartitions (barres)
  const barSections = [
    {title: 'Label EGalim', data: s.by_label},
    {title: 'Provenance', data: s.by_provenance},
    {title: 'Gamme des produits', data: s.by_gamme},
    {title: 'Catégorie', data: s.by_category},
    {title: 'Fournisseur', data: s.by_supplier},
  ];

  // On regroupe les barSections en 2 colonnes sur la page
  const secW = (pageW - 2 * margin - 8) / 2;
  let colIdx = 0;
  let rowY = y;
  let maxYInRow = y;

  for (const sec of barSections) {
    if (!sec.data || !sec.data.length) continue;
    const cx = margin + colIdx * (secW + 8);
    let sy = rowY;

    if (sy > 250) { doc.addPage(); sy = margin; rowY = margin; maxYInRow = margin; colIdx = 0; }

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.setTextColor(...INK);
    doc.text(sec.title, cx, sy);
    sy += 4;

    const barH = 4;
    const barMaxW = secW - 32;
    const maxPct = Math.max(...sec.data.map(i => i.pct), 1);
    for (const item of sec.data.slice(0, 10)) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(...INK);
      const lbl = String(item.label || '').substring(0, 22);
      doc.text(lbl, cx, sy + barH - 0.5);
      const bx = cx + 30;
      const bw = barMaxW * item.pct / maxPct;
      doc.setFillColor(233, 242, 236);
      doc.rect(bx, sy, barMaxW, barH, 'F');
      doc.setFillColor(111, 165, 133);
      if (bw > 0) doc.rect(bx, sy, bw, barH, 'F');
      doc.setTextColor(...MUTE);
      doc.text(item.pct + ' %', bx + barMaxW + 2, sy + barH - 0.5);
      sy += barH + 3;
    }
    maxYInRow = Math.max(maxYInRow, sy + 4);

    colIdx++;
    if (colIdx >= 2) {
      colIdx = 0;
      rowY = maxYInRow + 2;
      maxYInRow = rowY;
    }
  }
  y = Math.max(maxYInRow, rowY) + 4;

  // Tableau coût matières / repas (seulement si non masqué)
  if (!hid && s.daily && s.daily.length) {
    if (y > 220) { doc.addPage(); y = margin; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...INK);
    doc.text('Coût matières par repas', margin, y);
    y += 3;
    const dailyData = [...s.daily].reverse().filter(d => d.guests || d.cost || d.per_guest);
    doc.autoTable({
      startY: y,
      margin: {left: margin, right: margin},
      styles: {fontSize: 8, cellPadding: 2, textColor: INK},
      headStyles: {fillColor: GREEN, textColor: [255,255,255], fontStyle: 'bold', fontSize: 8},
      alternateRowStyles: {fillColor: [240, 245, 242]},
      columnStyles: {1: {halign: 'right'}, 2: {halign: 'right'}, 3: {halign: 'right'}},
      head: [['Date', 'Convives', 'Coût matières', '€ / convive']],
      body: dailyData.map(d => [dfr(d.date), d.guests ?? '—', pdfEur(d.cost), pdfEur(d.per_guest)]),
    });
    y = doc.lastAutoTable.finalY + 6;
  }

  // Note bas de page sur chaque page
  const totalPages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(...MUTE);
    doc.text(`Page ${p} / ${totalPages}`, pageW - margin, doc.internal.pageSize.getHeight() - 8, {align: 'right'});
    doc.text('CGRS', margin, doc.internal.pageSize.getHeight() - 8);
  }

  // Nom de fichier
  const dateStr = new Date().toISOString().slice(0, 10);
  const fromStr = f.from ? f.from : '';
  const toStr = f.to ? f.to : '';
  const periodStr = fromStr || toStr ? `_${fromStr}_${toStr}` : '';
  doc.save(`stats_cgrs${periodStr}_${dateStr}.pdf`);
}

function supplierForm(s = {}, mopts = {}) {
  const i = {};
  const inp = (k, label, type = 'text', cls = '', extra = {}) => field(label, i[k] = h('input', {type, value: s[k], ...extra}), cls);
  const days = checkGroup(state.meta.days.map(d => [d, DAY_LABELS[d]]), s.delivery_days);
  const cats = checkGroup(state.meta.categories.map(c => [c, c]), s.categories);
  const urlField = field('Lien du site de commande', i.order_url = h('input', {type: 'url', value: s.order_url, placeholder: 'https://…'}));
  const method = i.order_method = select([['', '—'], ...Object.entries(state.meta.order_methods)], s.order_method);
  const toggleUrl = () => { urlField.style.display = method.value === 'internet' ? '' : 'none'; };
  method.addEventListener('change', toggleUrl);
  const body = h('div', {class: 'f'},
    inp('name', 'Nom *'), inp('contact', 'Contact'), inp('phone', 'Téléphone'), inp('email', 'E-mail', 'email'),
    inp('siret', 'SIRET'), inp('address', 'Adresse'),
    field('Jours de livraison', days, 'full'),
    inp('franco', 'Franco : montant minimum pour une livraison (€ HT)', 'number', '', {step: 'any', min: 0}),
    field('Méthode de prise de commande', method), urlField,
    field('Catégories de produits vendues', cats, 'full'),
    field('Provenance par défaut de ses produits', i.local_default = select([['', '—'], ...Object.entries(state.meta.provenances)], s.local_default)),
    field('Direct producteur', i.direct_producteur = select([[0, 'Non'], [1, 'Oui']], s.direct_producteur)),
    ...(isAdmin() ? [field('Mots-clés de reconnaissance dans les PDF (séparés par « ; »)', i.keywords = h('input', {value: s.keywords, placeholder: 'ex. capmaree; cap maree'}), 'full'),
    field('Regex de lecture des PDF (optionnel : groupes code, label, qty, unit, unit_price, total)', i.parser_regex = h('input', {value: s.parser_regex}), 'full')] : []),
    field('Notes', i.notes = h('textarea', {rows: 2, value: s.notes}), 'full'));
  toggleUrl();
  const doSave = canWrite() ? async () => {
    const d = {};
    for (const k of ['name', 'contact', 'phone', 'email', 'siret', 'address', 'order_method', 'order_url', 'local_default', ...(isAdmin() ? ['keywords', 'parser_regex'] : []), 'notes'])
      d[k] = i[k].value.trim() === '' ? null : i[k].value.trim();
    if (!d.name) throw new Error('Le nom est obligatoire');
    d.franco = numOrNull(i.franco.value);
    d.direct_producteur = Number(i.direct_producteur.value || 0);
    d.delivery_days = days.values();
    d.categories = cats.values();
    if (d.order_method !== 'internet') d.order_url = d.order_url && d.order_method ? d.order_url : null;
    await api(s.id ? '/suppliers/' + s.id : '/suppliers', {method: s.id ? 'PUT' : 'POST', body: d});
  } : null;
  mopts.saveHandler = doSave;
  mopts.editTitle = s.id ? 'Modifier le fournisseur' : 'Nouveau fournisseur';
  modal(s.id ? (mopts.viewOnly ? s.name : 'Modifier le fournisseur') : 'Nouveau fournisseur', body, (canWrite() && !mopts.viewOnly) ? doSave : null, mopts);
}

function productForm(sups, p = {}, mopts = {}) {
  const i = {};
  const inp = (k, label, type = 'text', cls = '') => field(label, i[k] = h('input', {type, value: p[k], step: 'any'}), cls);
  const cats = [...new Set([...state.meta.categories, p.category].filter(Boolean))];
  const file = h('input', {type: 'file', style: 'display:none', accept: '.pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx,.odt,.ods,.txt'});
  const fname = h('span', {class: 'fname'}, 'Aucun fichier choisi');
  file.onchange = () => { fname.textContent = file.files[0] ? file.files[0].name : 'Aucun fichier choisi'; };
  const pick = h('label', {class: 'btn', style: 'margin:0;height:32px;padding:0 12px;font-size:14px;color:var(--ink)'}, '📎 ' + 'Choisir un fichier', file);
  const dsBox = h('div', {class: 'full'});
  let editable = canWrite() && !mopts.viewOnly;   // repasse à true via « ✏️ Modifier » (sans recharger la fiche)
  const drawDs = () => {
    dsBox.replaceChildren(...[h('label', {}, 'Fiche technique'),
      p.datasheet ? h('div', {class: 'filebox', style: 'margin-bottom:8px'}, fileLink(p.datasheet, '📄 ' + prettyFile(p.datasheet)),
        editable ? h('button', {class: 's d', onclick: async () => { try { await api(`/products/${p.id}/datasheet`, {method: 'DELETE'}); p.datasheet = null; drawDs(); } catch (e) { alert(e.message); } }}, 'Retirer') : null) : null,
      ...(editable ? [h('div', {class: 'filebox'}, pick, fname), h('div', {class: 'mute', style: 'font-size:12px;margin-top:3px'}, p.datasheet ? 'Choisir un fichier pour remplacer la fiche actuelle.' : 'PDF, image ou document (25 Mo maximum).')] : (p.datasheet ? [] : [h('span', {class: 'mute'}, 'Aucune fiche')]))].filter(Boolean));
  };
  drawDs();
  const hist = h('div', {class: 'full'});
  const body = h('div', {class: 'f'},
    inp('ref', 'Référence'), inp('name', 'Nom *'),
    field('Fournisseur', i.supplier_id = select([['', '—'], ...sups.map(s => [s.id, s.name])], p.supplier_id)),
    field('Catégorie', i.category = select([['', '—'], ...cats.map(c => [c, c])], p.category)),
    field('Gamme', i.gamme = select([['', '—'], ...Object.entries(state.meta.gammes)], p.gamme)),
    field('Label EGalim', i.label_egalim = select([['sans', 'Sans label'], ['bio', 'Bio'], ['autre', 'Autre label']], p.label_egalim || 'bio')),
    inp('label_detail', 'Détail du label (AOP, Label Rouge, MSC…)'),
    field('Provenance', i.provenance = select([['', '—'], ...Object.entries(state.meta.provenances)], p.provenance)),
    field('Direct producteur', i.direct_producteur = select([[0, 'Non'], [1, 'Oui']], p.direct_producteur)),
    field('Commerce équitable', i.commerce_equitable = select([[0, 'Non'], [1, 'Oui']], p.commerce_equitable)),
    field('À éviter', i.avoid = h('input', {type: 'checkbox', checked: !!p.avoid, title: 'Produit à éviter : signalé en orange dans la liste'})),
    field('Favori ★', i.favorite = h('input', {type: 'checkbox', checked: !!p.favorite, title: 'Produit favori : étoile dans la liste et filtre « Favoris »'})),
    field('Unité de prix', i.unit = select(['kg', 'g', 'l', 'unité', 'pièce', 'botte', 'barquette', 'colis', 'bidon', 'boite'].map(u => [u, u]), p.unit || 'kg')),
    inp('unit_price', 'Prix unitaire HT (€)', 'number'),
    dsBox,
    field('Notes', i.notes = h('textarea', {rows: 2, value: p.notes}), 'full'),
    p.id ? hist : null);
  if (p.id) {
    api(`/products/${p.id}/prices`).then(rows => {
      const asc = [...rows].reverse();
      hist.replaceChildren(h('label', {}, 'Évolution du prix'),
        chart(asc.map(r => ({x: r.date, y: r.price, tip: `${dfr(r.date)} : ${eur(r.price)} / ${r.unit || ''}`})), v => eur(v)),
        rows.length ? h('div', {class: 'tablewrap'}, h('table', {},
          h('tr', {}, ['Date', 'Prix HT', 'Origine'].map((x, k) => h('th', {class: k === 1 ? 'n' : ''}, x))),
          rows.map(r => h('tr', {}, h('td', {}, dfr(r.date)), h('td', {class: 'n'}, `${eur(r.price)} / ${r.unit || ''}`),
            h('td', {class: 'mute'}, r.source === 'reception' ? `Réception ${r.order_ref || ''} (${r.order_kind === 'facture' ? 'facture' : 'bon de livraison'})` : 'Saisie manuelle')))))
          : h('div', {class: 'mute'}, 'Aucun relevé de prix pour le moment : le prix est mis à jour à chaque réception.'));
    }).catch(() => {});
  }
  if (!p.id) {   // nouveau produit : « direct producteur » suit celui du fournisseur choisi
    const follow = () => { const s = sups.find(x => String(x.id) === i.supplier_id.value); if (s) i.direct_producteur.value = s.direct_producteur ? 1 : 0; };
    i.supplier_id.addEventListener('change', follow);
    follow();
  }
  const doSave = canWrite() ? async () => {
    const d = {};
    for (const k of ['ref', 'name', 'label_detail', 'notes', 'category', 'gamme', 'provenance']) d[k] = i[k].value.trim() === '' ? null : i[k].value.trim();
    if (!d.name) throw new Error('Le nom est obligatoire');
    d.supplier_id = numOrNull(i.supplier_id.value);
    d.unit_price = numOrNull(i.unit_price.value);
    d.unit = i.unit.value;
    d.direct_producteur = Number(i.direct_producteur.value || 0);
    d.commerce_equitable = Number(i.commerce_equitable.value || 0);
    d.avoid = i.avoid.checked ? 1 : 0;
    d.favorite = i.favorite.checked ? 1 : 0;
    d.label_egalim = i.label_egalim.value || 'bio';
    const r = await api(p.id ? '/products/' + p.id : '/products', {method: p.id ? 'PUT' : 'POST', body: d});
    if (file.files[0]) {
      const fd = new FormData(); fd.append('file', file.files[0]);
      await api(`/products/${p.id || r.id}/datasheet`, {method: 'POST', body: fd});
    }
  } : null;
  mopts.saveHandler = doSave;
  mopts.editTitle = p.id ? 'Modifier le produit' : 'Nouveau produit';
  mopts.onSwitch = () => { editable = true; drawDs(); };   // « ✏️ Modifier » : rend la fiche technique éditable
  modal(p.id ? (mopts.viewOnly ? p.name : 'Modifier le produit') : 'Nouveau produit', body, (canWrite() && !mopts.viewOnly) ? doSave : null, mopts);
}

/* ---------- Réceptions : bons de livraison et factures ---------- */
const KINDS = [['livraison', 'Bon de livraison (provisoire)'], ['facture', 'Facture (définitive)']];
const kindPill = k => k === 'facture' ? h('span', {class: 'pill'}, 'Facture') : h('span', {class: 'pill w', title: 'Provisoire : sera remplacé par la facture'}, 'Bon de livraison');
const ordView = {q: '', kind: '', sup: ''};
let importQueue = [];
async function pageOrders() {
  const [list, sups] = await Promise.all([api('/orders'), api('/suppliers')]);
  const q = h('input', {placeholder: 'Rechercher (réf., fournisseur)…', value: ordView.q, style: 'min-width:200px'});
  const fk = select([['', 'Tous les types'], ['livraison', 'Bons de livraison'], ['facture', 'Factures']], ordView.kind);
  const fs = select([['', 'Tous les fournisseurs'], ...sups.map(s => [s.id, s.name])], ordView.sup);
  const tb = h('tbody');
  const totBox = h('strong', {});
  const draw = () => {
    ordView.q = q.value; ordView.kind = fk.value; ordView.sup = fs.value;
    const t = q.value.toLowerCase();
    const vis = list.filter(o => (!t || ((o.ref || '') + ' ' + (o.supplier_name || '')).toLowerCase().includes(t))
      && (!fk.value || o.kind === fk.value) && (!fs.value || String(o.supplier_id) === fs.value));
    totBox.textContent = eur(vis.reduce((a, o) => a + (Number(o.total_ht) || 0), 0));
    tb.replaceChildren(...vis.map(o => {
      const tr = h('tr', {class: 'clickable'},
        h('td', {}, dfr(o.date)), h('td', {}, kindPill(o.kind)), h('td', {}, o.ref || ''), h('td', {}, o.supplier_name || '—'),
        h('td', {class: 'n'}, o.nb_lines), h('td', {class: 'n'}, eur(o.total_ht)),
        h('td', {}, o.source_file ? fileLink(o.source_file, '📄 PDF') : ''),
        h('td', {class: 'n'},
          h('button', {class: 'icon-btn', title: 'Ouvrir', onclick: e => { e.stopPropagation(); api('/orders/' + o.id).then(orderForm); }}, '✏️'),
          canWrite() ? h('button', {class: 'icon-btn d', title: 'Supprimer', onclick: e => { e.stopPropagation(); confirmDel('Supprimer cette réception ?', () => api('/orders/' + o.id, {method: 'DELETE'}))(); }}, '🗑️') : null));
      tr.addEventListener('click', () => api('/orders/' + o.id).then(d => orderForm(d, undefined, [], {viewOnly: true, onEdit: () => api('/orders/' + o.id).then(orderForm)})));
      return tr;
    }));
  };
  for (const c of [q, fk, fs]) c.addEventListener('input', draw);
  draw();
  return h('div', {},
    h('div', {class: 'tools'}, h('h2', {}, 'Bons de livraison & factures'),
      canWrite() ? h('div', {class: 'ctl'},
        h('label', {class: 'btn p'}, '⬆ Importer des PDF', h('input', {type: 'file', accept: '.pdf', multiple: true, style: 'display:none', onchange: importFiles})),
        h('button', {onclick: () => orderForm({lines: [{}], kind: 'livraison'})}, '+ Saisie manuelle')) : null),
    h('div', {class: 'card row'}, field('Recherche', q), field('Type', fk), field('Fournisseur', fs)),
    h('div', {class: 'card tablewrap'}, list.length ? h('table', {},
      h('thead', {}, h('tr', {}, ['Date', 'Type', 'Réf.', 'Fournisseur', 'Lignes', 'Total HT', 'Fichier source', ''].map((x, k) => h('th', {class: k === 4 || k === 5 ? 'n' : ''}, x)))), tb)
      : h('div', {class: 'empty'}, 'Aucune réception.' + (canWrite() ? ' Importez un PDF ou saisissez un bon de livraison.' : ''))),
    h('div', {class: 'card', style: 'padding:10px 16px;text-align:right'}, h('span', {class: 'mute'}, 'Total des lignes : '), totBox));
}
function importFiles(ev) {
  importQueue = [...ev.target.files]; docQueue = [];
  ev.target.value = '';
  nextImport();
}
let docQueue = [];
async function nextImport() {
  if (docQueue.length) return showNextDoc();
  const file = importQueue.shift();
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  busy(true);
  let r;
  try { r = await api('/orders/parse-pdf', {method: 'POST', body: fd}); }
  catch (e) { busy(false); alert(`${file.name} : ${e.message}`); return nextImport(); }
  busy(false);
  docQueue = r.documents.map((d, i) => ({d, i, n: r.documents.length, name: file.name}));
  showNextDoc();
}
function showNextDoc() {
  const {d: r, i, n, name} = docQueue.shift();
  if (r.duplicate) {
    alert(`« ${name} »${n > 1 ? ` (bon ${i + 1}/${n})` : ''} : ${r.kind === 'facture' ? 'la facture' : 'le bon'} ${r.duplicate.ref} est déjà enregistré${r.duplicate.date ? ' (' + dfr(r.duplicate.date) + ')' : ''}. Import ignoré.`);
    return nextImport();
  }
  const where = n > 1 ? `« ${name} » contient ${n} bons : bon ${i + 1}/${n}` : `« ${name} »`;
  const more = docQueue.length + importQueue.length;
  const notice = [r.lines.length ? `${r.lines.length} ligne(s) lue(s) dans ${where}. Vérifiez avant d'enregistrer.` : `Aucune ligne reconnue dans ${where}.`,
    r.ignored ? `${r.ignored} ligne(s) ignorée(s) (cotisation interfel ou quantité nulle).` : '',
    more ? `Encore ${more} élément(s) à traiter ensuite.` : ''].filter(Boolean).join(' ');
  orderForm({supplier_id: r.supplier_id, supplier_guess: r.supplier_guess, imported: true, ref: r.ref, kind: r.kind, date: r.date, total_ht: r.total_ht,
    source_file: r.source_file, bl_refs: r.bl_refs, lines: r.lines.length ? r.lines : [{}]}, notice, r.warnings || [], {onClose: nextImport});
}
async function orderForm(o, notice, warnings = [], mopts = {}) {
  const [sups, prods] = await Promise.all([api('/suppliers'), api('/products')]);
  const hdr = {};
  const prodOpts = [['', '— non rattaché —'], ['__new__', '➕ Créer le produit'], ...prods.map(p => [p.id, (p.ref ? p.ref + ' · ' : '') + p.name])];
  const tb = h('tbody');
  const rows = [];
  const hintFor = r => {
    const p = prods.find(x => String(x.id) === r.product.value);
    const pu = numOrNull(r.pu.value);
    r.hint.textContent = (p && p.unit_price != null && pu != null && sameUnit(r.unit.value, p.unit) && Math.abs(p.unit_price - pu) > 1e-9)
      ? `Prix actuel : ${eur(p.unit_price)} → mis à jour à l'enregistrement` : '';
  };
  const addLine = (l = {}) => {
    const r = {
      ref: h('input', {value: l.ref, style: 'min-width:80px;width:100px'}),
      product: select(prodOpts, l.product_id ?? (o.imported && l.label ? '__new__' : '')),
      label: h('input', {value: l.label, style: 'min-width:200px'}),
      qty: h('input', {type: 'number', step: 'any', value: l.qty, style: 'width:90px'}),
      unit: h('input', {value: l.unit, style: 'min-width:60px;width:80px'}),
      pu: h('input', {type: 'number', step: 'any', value: l.unit_price, style: 'width:90px'}),
      total: h('input', {type: 'number', step: 'any', value: l.total_ht, style: 'width:100px'}),
      hint: h('small', {class: 'hint'}),
    };
    const recalc = () => { if (r.qty.value && r.pu.value) r.total.value = (r.qty.value * r.pu.value).toFixed(2); sum(); hintFor(r); };
    r.qty.oninput = r.pu.oninput = recalc;
    r.total.oninput = sum;
    r.unit.oninput = () => hintFor(r);
    r.product.onchange = () => {
      const p = prods.find(x => String(x.id) === r.product.value);
      if (p) {
        if (!r.label.value) r.label.value = p.name;
        if (!r.ref.value && p.ref) r.ref.value = p.ref;
        if (!r.unit.value) r.unit.value = p.unit || '';
        if (!r.pu.value && p.unit_price != null) { r.pu.value = p.unit_price; recalc(); }
      }
      hintFor(r);
    };
    const tr = h('tr', {}, h('td', {}, r.ref), h('td', {}, r.product), h('td', {}, r.label), h('td', {}, r.qty), h('td', {}, r.unit),
      h('td', {}, r.pu, r.hint), h('td', {}, r.total),
      h('td', {}, h('button', {class: 's d', onclick: () => { tr.remove(); rows.splice(rows.indexOf(r), 1); sum(); }}, '✕')));
    r.tr = tr;
    rows.push(r);
    tb.append(tr);
    hintFor(r);
  };
  const sum = () => { hdr.total.value = rows.reduce((a, r) => a + (Number(r.total.value) || 0), 0).toFixed(2); loadCandidates(); };

  // facture : bons de livraison à remplacer
  const repl = h('div', {class: 'card', style: 'display:none'});
  const picked = new Map((o.replaces || []).map(id => [id, true]));
  let candSeq = 0;
  async function loadCandidates() {
    const seq = ++candSeq;
    const supId = hdr.supplier_id.value && hdr.supplier_id.value !== '__new__' ? Number(hdr.supplier_id.value) : null;
    if (!canWrite() || hdr.kind.value !== 'facture' || !supId) { repl.style.display = 'none'; return; }
    let list;
    try { list = await api('/orders/candidates', {method: 'POST', body: {supplier_id: supId, kind: 'facture', total_ht: numOrNull(hdr.total.value), refs: o.bl_refs || [], exclude_id: o.id || null}}); }
    catch { return; }
    if (seq !== candSeq) return;
    for (const c of list) if (!picked.has(c.id)) picked.set(c.id, c.match);
    repl.style.display = '';
    repl.replaceChildren(...[h('h3', {}, 'Bon(s) de livraison remplacé(s) par cette facture'),
      h('p', {class: 'mute', style: 'margin-top:0'}, 'La facture remplace le bon de livraison correspondant : il sera supprimé à l\'enregistrement, ses quantités ne sont comptées qu\'une fois.'),
      list.length ? list.map(c => h('label', {class: 'chk'},
        `${c.ref || 'Bon de livraison'} du ${dfr(c.date)} — ${eur(c.total_ht)}`, c.match ? h('span', {class: 'pill'}, c.reason) : null,
        h('input', {type: 'checkbox', checked: picked.get(c.id), onchange: e => picked.set(c.id, e.target.checked)})))
        : h('div', {class: 'mute'}, 'Aucun bon de livraison en attente pour ce fournisseur.')].flat().filter(Boolean));
  }

  const supSel = hdr.supplier_id = select([['', '—'], ['__new__', '➕ Créer un nouveau fournisseur…'], ...sups.map(s => [s.id, s.name])],
    o.supplier_id ?? (o.imported && o.supplier_guess ? '__new__' : ''));
  hdr.new_supplier = h('input', {value: o.supplier_guess || '', placeholder: 'Nom du nouveau fournisseur', style: 'margin-top:6px'});
  hdr.new_direct = h('input', {type: 'checkbox'});
  hdr.new_direct_box = h('label', {class: 'chk', style: 'margin:6px 0 0'}, 'Direct producteur', hdr.new_direct);
  const toggleNew = () => { const n = supSel.value === '__new__'; hdr.new_supplier.style.display = n ? '' : 'none'; hdr.new_direct_box.style.display = n ? '' : 'none'; };
  supSel.addEventListener('change', () => { toggleNew(); loadCandidates(); });
  // --- Zone PDF (BL / facture) ---
  let currentPdf = o.source_file || null;
  const pdfInput = h('input', {type: 'file', accept: '.pdf', style: 'display:none'});
  const pdfStatus = h('span', {class: 'mute'});
  const pdfDelBtn = h('button', {class: 's d', style: 'margin-left:6px', title: 'Supprimer le PDF', onclick: async e => {
    e.preventDefault();
    if (o.id && currentPdf) {
      await api('/orders/' + o.id + '/upload-pdf', {method: 'DELETE'});
    }
    currentPdf = null;
    pdfInput.value = '';
    renderPdfStatus();
  }});
  const renderPdfStatus = () => {
    if (pdfInput.files && pdfInput.files[0]) {
      pdfStatus.replaceChildren('📄 ', h('em', {}, pdfInput.files[0].name), ' (sera joint à l\'enregistrement)');
      pdfDelBtn.style.display = '';
    } else if (currentPdf) {
      pdfStatus.replaceChildren('📄 ', fileLink(currentPdf));
      pdfDelBtn.style.display = '';
    } else {
      pdfStatus.replaceChildren(h('span', {class: 'mute'}, 'Aucun fichier joint'));
      pdfDelBtn.style.display = 'none';
    }
  };
  pdfInput.onchange = renderPdfStatus;
  const pdfBox = canWrite()
    ? (mopts.viewOnly
        ? h('p', {class: 'mute', style: 'margin:10px 0 0'}, 'Fichier source : ',
            currentPdf ? fileLink(currentPdf) : h('span', {}, 'aucun'))   // en consultation : le PDF lié reste visible
        : h('div', {style: 'margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap'},
            h('label', {class: 'btn s', style: 'cursor:pointer', title: 'Joindre un PDF (BL ou facture)'}, '📎 PDF', pdfInput),
            pdfStatus, pdfDelBtn))
    : (currentPdf ? h('p', {class: 'mute'}, 'Fichier source : ', fileLink(currentPdf)) : null);

  const body = h('div', {},
    notice ? h('div', {class: 'note'}, notice) : null,
    warnings.map(w => h('div', {class: 'note w'}, '⚠ ' + w)),
    h('div', {class: 'f', style: 'margin-bottom:14px'},
      h('div', {}, h('label', {}, 'Fournisseur'), supSel, hdr.new_supplier, hdr.new_direct_box),
      field('Type', hdr.kind = select(KINDS, o.kind || 'livraison', {onchange: loadCandidates})),
      field('Référence', hdr.ref = h('input', {value: o.ref})),
      field('Date', hdr.date = h('input', {type: 'date', value: o.date || today()})),
      field('Total HT (€)', hdr.total = h('input', {type: 'number', step: 'any', value: o.total_ht, onchange: loadCandidates}))),
    h('div', {class: 'tablewrap'}, h('table', {},
      h('thead', {}, h('tr', {}, ['Référence', 'Produit rattaché', 'Nom', 'Qté', 'Unité', 'PU HT', 'Total HT', ''].map(x => h('th', {}, x)))), tb)),
    h('button', {style: 'margin:10px 0', onclick: () => addLine()}, '+ Ligne'),
    repl,
    pdfBox,
    o.notes ? h('p', {class: 'mute', style: 'white-space:pre-line'}, o.notes) : null);
  renderPdfStatus();
  (o.lines && o.lines.length ? o.lines : [{}]).forEach(addLine);
  toggleNew();
  loadCandidates();
  const doSave = canWrite() ? async () => {
    const newSup = supSel.value === '__new__';
    if (newSup && !hdr.new_supplier.value.trim()) throw new Error('Indiquez le nom du nouveau fournisseur');
    const lines = rows.map(r => ({
      create_product: r.product.value === '__new__',
      product_id: r.product.value === '__new__' ? null : numOrNull(r.product.value),
      ref: r.ref.value.trim() || null, label: r.label.value.trim() || null, qty: numOrNull(r.qty.value),
      unit: r.unit.value.trim() || null, unit_price: numOrNull(r.pu.value), total_ht: numOrNull(r.total.value)}))
      .filter(l => l.label || l.product_id || l.qty);
    const kind = hdr.kind.value;
    const data = {supplier_id: newSup ? null : numOrNull(supSel.value), new_supplier_name: newSup ? hdr.new_supplier.value.trim() : null, new_supplier_direct: newSup && hdr.new_direct.checked,
      kind, ref: hdr.ref.value.trim() || null, date: hdr.date.value || null, total_ht: numOrNull(hdr.total.value),
      source_file: currentPdf, notes: o.notes || null,
      replaces: kind === 'facture' ? [...picked].filter(([, on]) => on).map(([id]) => id) : [], lines};
    const res = await api(o.id ? '/orders/' + o.id : '/orders', {method: o.id ? 'PUT' : 'POST', body: data});
    // Upload du PDF si un fichier a été sélectionné
    if (pdfInput.files && pdfInput.files[0]) {
      const fd = new FormData();
      fd.append('file', pdfInput.files[0]);
      await fetch('/api/orders/' + res.id + '/upload-pdf', {method: 'POST', headers: {'x-requested-with': 'cgrs'}, body: fd});
    }
    const c = res.created || {};
    const msgs = [];
    if (c.supplier) msgs.push(`Fournisseur créé : ${c.supplier}`);
    if (c.products && c.products.length) msgs.push(`${c.products.length} produit(s) créé(s) à compléter dans Produits (catégorie, gamme, label, provenance)`);
    if (res.replaced && res.replaced.length) msgs.push(`Remplacé : ${res.replaced.join(', ')}`);
    for (const u of (res.price_updates || [])) msgs.push(`Prix mis à jour — ${u.name} : ${u.old == null ? 'nouveau' : eur(u.old)} → ${eur(u.new)} / ${u.unit || ''}`);
    if (msgs.length) toast(msgs.join(' — '), 12000);
  } : null;
  mopts.saveHandler = doSave;
  const m = modal(o.id ? 'Réception' : 'Nouvelle réception', body, (canWrite() && !mopts.viewOnly) ? doSave : null, mopts);
  return m;
}

/* ---------- Liste de courses (PDF) ---------- */
function isoLocal(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function shoppingListModal() {
  const today = new Date();
  const fromInp = h('input', {type: 'date', value: isoLocal(new Date(today.getFullYear(), today.getMonth(), 1))});
  const toInp = h('input', {type: 'date', value: isoLocal(new Date(today.getFullYear(), today.getMonth() + 1, 0))});
  const body = h('div', {class: 'f'}, field('Du', fromInp), field('Au', toInp));
  modal('Liste de courses (PDF)', body, async () => {
    if (!fromInp.value || !toInp.value) throw new Error('Indiquez les deux dates');
    if (fromInp.value > toInp.value) throw new Error('La date de début est après la date de fin');
    const rows = await api('/meals/shopping-list?date_from=' + fromInp.value + '&date_to=' + toInp.value);
    if (!rows.length) { toast('Aucun produit sorti pour les repas de cette période', 5000); return; }
    exportShoppingPdf(rows, fromInp.value, toInp.value);
  });
}

function exportShoppingPdf(rows, from, to) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: 'portrait', unit: 'mm', format: 'a4'});
  const dfr2 = s => s.split('-').reverse().join('/');
  doc.setFontSize(14);
  doc.text('Liste de courses du ' + dfr2(from) + ' au ' + dfr2(to), 14, 16);
  const body = [];
  let cur = null;
  rows.forEach(r => {
    if (r.category !== cur) {
      cur = r.category;
      body.push([{content: String(cur).toUpperCase(), colSpan: 3, styles: {fillColor: [230, 240, 230], fontStyle: 'bold'}}]);
    }
    body.push([r.label, String(r.qty).replace('.', ','), r.unit || '']);
  });
  doc.autoTable({
    head: [['Produit', 'Quantité', 'Unité']], body, startY: 22,
    styles: {fontSize: 10}, columnStyles: {1: {halign: 'right'}},
  });
  doc.save('liste_courses_' + from + '_' + to + '.pdf');
}

async function importMenuPdf(pageWrap) {
  const fileInput = h('input', {type: 'file', accept: '.pdf', style: 'display:none'});
  document.body.appendChild(fileInput);
  fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) { fileInput.remove(); return; }
    const fd = new FormData();
    fd.append('file', file);
    let result;
    try {
      result = await fetch('/api/meals/parse-menu-pdf', {method: 'POST', headers: {'x-requested-with': 'cgrs'}, body: fd}).then(async r => {
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'Erreur import'); }
        return r.json();
      });
    } catch(e) { toast('Erreur : ' + e.message, 6000); fileInput.remove(); return; }
    fileInput.remove();
    showMenuImportPreview(result, pageWrap);
  };
}

function showMenuImportPreview(result, pageWrap) {
  const repas = result.repas || [];
  if (!repas.length) { toast('Aucun repas détecté dans le PDF.', 5000); return; }

  const checks = repas.map(r => {
    const cb = h('input', {type: 'checkbox', checked: !r.already_exists});
    return {r, cb};
  });

  const rows = checks.map(({r, cb}) =>
    h('tr', {style: r.already_exists ? 'opacity:.55' : ''},
      h('td', {}, cb),
      h('td', {}, dfr(r.date), r.already_exists ? h('span', {class: 'pill', style: 'margin-left:6px;font-size:11px;background:var(--acc2);color:var(--acc)'}, 'existe') : null),
      h('td', {}, r.entree || ''),
      h('td', {}, r.plat || ''),
      h('td', {}, r.accompagnement || ''),
      h('td', {}, r.laitage || ''),
      h('td', {}, r.dessert || '')));

  const selAll = h('input', {type: 'checkbox', checked: true, title: 'Tout sélectionner'});
  selAll.onchange = () => checks.forEach(({cb}) => cb.checked = selAll.checked);

  const body = h('div', {},
    h('p', {class: 'mute'}, `${repas.length} repas détecté(s) dans ${result.source_file || 'le PDF'}. Les repas existants sont grisés.`),
    h('div', {class: 'tablewrap'}, h('table', {},
      h('thead', {}, h('tr', {}, [h('th', {}, selAll), ...['Date', 'Entrée', 'Plat', 'Accompagnement', 'Laitage', 'Dessert'].map(x => h('th', {}, x))])),
      h('tbody', {}, ...rows))));

  modal('Importer des repas depuis le PDF', body, async () => {
    const selected = checks.filter(({cb}) => cb.checked).map(({r}) => r);
    if (!selected.length) throw new Error('Sélectionnez au moins un repas');
    let created = 0;
    for (const r of selected) {
      await api('/meals', {method: 'POST', body: {date: r.date, nb_maternelles: CONVIVES_DEF.mat, nb_elementaires: CONVIVES_DEF.elem, nb_adultes: CONVIVES_DEF.adu,
        entree: r.entree || null, plat: r.plat || null, accompagnement: r.accompagnement || null,
        laitage: r.laitage || null, dessert: r.dessert || null, statut: 'prevu', items: []}});
      created++;
    }
    toast(`${created} repas importé(s) avec succès`);
    // Refresh page
    if (pageWrap) { const fresh = await pageMeals(); pageWrap.replaceChildren(...fresh.childNodes); }
  });
}
