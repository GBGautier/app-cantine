      if (p && price != null && q) {
        const u = (row.unitEl ? row.unitEl.value : p.unit || '').trim().toLowerCase();
        const pu = (p.unit || '').trim().toLowerCase();
        if (!u || u === pu) c = q * price;
        else { const a = FACT[u], b = FACT[pu]; c = a && b && a[0] === b[0] ? q * a[1] / b[1] * price : null; }
      }
      if (row.costTd) row.costTd.textContent = c != null ? eur(c) : '—';
      if (c != null) tot += c; else if (q && row.productEl.value) missing++;
    }
    bilanTotalBox.textContent = eur(tot) + (missing ? ` (${missing} sans prix)` : '');
  }

  function addBilanRow(it = {}, prepend = false) {
    const productEl = makeProductPicker(it.product_id);
    const qtyEl = h('input', {type: 'number', step: 'any', min: 0, value: it.qty ?? '', style: 'width:100px'});
    const unitEl = h('input', {value: it.unit || '', style: 'width:70px'});
    const prixReelEl = h('input', {type: 'number', step: 'any', min: 0, value: it.prix_reel != null ? it.prix_reel : '', placeholder: '—', style: 'width:90px'});
    const costTd = h('td', {class: 'n'});
    const key = bilanKey(it.product_id, it.label);
    const row = {productEl, qtyEl, unitEl, prixReelEl, costTd, key, touched: false, _label: it.label || ''};
    bilanRows.push(row);
    const productCell = h('td', {}, productEl,
      (it.product_id == null && it.label) ? h('div', {class: 'mute', style: 'font-size:12px'}, it.label) : null);
    const tr = h('tr', {},
      productCell,
      h('td', {}, qtyEl),
      h('td', {}, unitEl),
      costTd,
      h('td', {}, h('button', {class: 's d', onclick: () => { tr.remove(); bilanRows = bilanRows.filter(r => r !== row); bilanDismissed.add(row.key); calcBilanTotal(); }}, '✕')));
    tr._row = row;
    productEl.addChangeListener(() => { const p = prods.find(x => String(x.id) === productEl.value); if (p && !unitEl.value) unitEl.value = p.unit || ''; row.key = bilanKey(numOrNull(productEl.value), row._label); if (!row._syncing) row.touched = true; calcBilanTotal(); });
    qtyEl.addEventListener('input', () => { row.touched = true; calcBilanTotal(); });
    prixReelEl.addEventListener('input', calcBilanTotal);
    unitEl.addEventListener('input', calcBilanTotal);
    if (prepend && bilanTbody.firstChild) bilanTbody.insertBefore(tr, bilanTbody.firstChild);
    else bilanTbody.append(tr);
    calcBilanTotal();
    return row;
  }

  if (m.items && m.items.length) {
    for (const it of m.items) { const r = addBilanRow(it); r.touched = true; }   // quantités réellement sorties et enregistrées : jamais recalées automatiquement
  }

  const finaliseCb = h('input', {type: 'checkbox', checked: m.statut === 'passe'});
  const modifCb = h('input', {type: 'checkbox', checked: !!m.modif_prevu});

  const tab3Content = h('div', {},
    h('p', {class: 'mute', style: 'margin-top:0;font-size:13px'}, 'Saisissez les quantités réellement sorties. Vous pouvez ajouter ou supprimer des lignes.'),
    h('div', {class: 'tablewrap'}, h('table', {},
      h('thead', {}, h('tr', {}, ['Produit', 'Qté réelle', 'Unité'].map(x => h('th', {}, x)).concat(['Coût', ''].map(x => h('th', {style: 'text-align:right'}, x))))),
      bilanTbody)),
    h('div', {style: 'margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px'},
      h('button', {onclick: () => { const r = addBilanRow({}, true); r.touched = true; }}, '+ Produit'),
      h('div', {style: 'display:flex;align-items:center;gap:16px'},
        h('label', {class: 'chk', style: 'margin:0'}, 'Modification du repas', modifCb),
        h('label', {class: 'chk', style: 'margin:0'}, 'Finalisé', finaliseCb),
        h('div', {}, h('span', {class: 'mute'}, 'Total réel : '), bilanTotalBox))),
    h('div', {style: 'margin-top:16px'}, field('Commentaire / observations post-repas', commentairePost)));

  // Recalcul des quantités après changement de convives (bouton « ↻ Recalculer les quantités ») :
  // - produit lié au grammage GEMRCN : quantité recalculée depuis les grammages par personne × convives actuels ;
  //   le pourcentage d'évolution obtenu est appliqué aux autres produits de la même recette ;
  // - recette sans produit lié au grammage : évolution proportionnelle au nombre total de convives.
  const recalcEstQtys = () => {
    const cur = {mat: Number(hdr.mat.value) || 0, elem: Number(hdr.elem.value) || 0, adu: Number(hdr.adu.value) || 0};
    const ref = estRefConvives || cur;
    const curGuests = cur.mat + cur.elem + cur.adu, refGuests = ref.mat + ref.elem + ref.adu;
    const groups = {};
    for (const r of estRows) if (!r._manual && r._cat != null) (groups[r._cat] = groups[r._cat] || []).push(r);
    for (const rows of Object.values(groups)) {
      const principal = rows.find(r => r._gem);
      let ratio = null;
      if (principal && principal._gem) {
        const g = principal._gem;
        const tot = ((g.mat || 0) * cur.mat + (g.elem || 0) * cur.elem + (g.adu || 0) * cur.adu) * (g.coeff || 1);   // quantité à commander
        const unit = principal.qtyUnitLbl.value || 'kg';
        const shown = unit === 'unité' ? Math.round(tot) : unit === 'l' ? Number(tot.toFixed(3)) : Number((tot / 1000).toFixed(3));
        const oldQ = numOrNull(principal.qtyEl.value);
        if (oldQ > 0) ratio = shown / oldQ;
        principal.qtyEl.value = String(shown);
      }
      if (ratio == null) ratio = refGuests > 0 ? curGuests / refGuests : 1;
      for (const r of rows) {
        if (r === principal) continue;
        const q = numOrNull(r.qtyEl.value);
        if (q != null && q > 0) r.qtyEl.value = String(Number((q * ratio).toFixed(3)));
      }
    }
    estRefConvives = cur;
    upd();   // les convives redeviennent la référence → le bouton disparaît
    calcEstTotal();
    rebuildEstimation();   // rafraîchit l'affichage et recale le Bilan sur les nouvelles quantités
  };

  // Crée une ligne du tableau d'estimation. `prev` : ligne précédente (préserve les saisies) ; `manual` : ligne ajoutée à la main.
  function addEstRow(it, prev = null, manual = false) {
    const initProdId = prev ? prev.productEl.value : (it.product_id != null ? String(it.product_id) : '');
    const initQty = prev ? prev.qtyEl.value : (it.qkg > 0 ? it.qkg.toFixed(3) : '');
    const initPrice = prev ? prev.prixHTEl.value : (it.price != null ? String(it.price) : '');
    const initUnit = (prev && prev.unit != null) ? String(prev.unit) : (it.unit || 'kg');   // unité sauvegardée prioritaire sur l'unité recalculée
    const productEl = makeProductPicker(initProdId !== '' ? Number(initProdId) : null);
    const qtyEl = h('input', {type: 'number', step: 'any', min: 0, value: initQty, style: 'width:90px', title: 'Quantité calculée (modifiable)'});
    const prixHTEl = h('input', {type: 'number', step: 'any', min: 0, value: initPrice, placeholder: '—', style: 'width:80px', title: 'Prix HT (modifiable)'});
    const costTd = h('td', {class: 'n'});
    const qtyUnitLbl = h('input', {style: 'width:64px;font-size:12px;margin-left:3px;color:var(--mute);border:1px dashed var(--line);border-radius:4px;padding:2px 4px', value: initUnit, title: 'Unité (modifiable)'});
    const priceUnitLbl = h('span', {class: 'mute', style: 'font-size:12px;margin-left:3px'}, '€/' + (initUnit || 'kg'));
    const row = {productEl, qtyEl, prixHTEl, costTd, _cat: it.cat, _label: it.label, _gem: it.gem || null, qtyUnitLbl, priceUnitLbl, _manual: manual, _autoPrice: true, _autoUnit: true};
    estRows.push(row);
    // Lignes manuelles : catégorie et libellé éditables
    let catSel = null, labelInp = null;
    if (manual) {
      catSel = h('select', {style: 'max-width:130px', title: 'Catégorie'},
        [h('option', {value: ''}, '—')].concat(Object.keys(MEAL_CATS_LABELS).map(k => h('option', {value: k}, MEAL_CATS_LABELS[k]))));
      catSel.value = it.cat || '';
      labelInp = h('input', {placeholder: 'Libellé…', style: 'width:100%', title: 'Libellé', value: it.label || ''});
      catSel.addEventListener('change', () => { row._cat = catSel.value || ''; });
      labelInp.addEventListener('input', () => { row._label = labelInp.value; });
    }
    // Quand le produit change : prix auto et unités mises à jour
    productEl.addChangeListener(() => {
      const p = prods.find(x => String(x.id) === productEl.value);
      if (p) {
        // en changeant de produit : on reprend son prix (à la date du repas) et son unité,
        // sauf si l'utilisateur a saisi lui-même un prix ou une unité pour cette ligne
        if (row._autoPrice) prixHTEl.value = historicalPrices[String(p.id)] ?? p.unit_price ?? '';
        if (p.unit && row._autoUnit) { qtyUnitLbl.value = p.unit; priceUnitLbl.textContent = '€/' + p.unit; }
      }
      calcEstTotal();
    });
    qtyEl.addEventListener('input', calcEstTotal);
    prixHTEl.addEventListener('input', () => { row._autoPrice = false; calcEstTotal(); });
    qtyUnitLbl.addEventListener('input', () => { row._autoUnit = false; priceUnitLbl.textContent = '€/' + (qtyUnitLbl.value || '—'); });
    row.tr = h('tr', {},
      h('td', {class: 'mute'}, manual ? catSel : (MEAL_CATS_LABELS[it.cat] || '')),
      h('td', {}, manual ? labelInp : (it.label || '')),
      h('td', {}, productEl),
      h('td', {class: 'n'}, h('div', {style: 'display:flex;align-items:center;justify-content:flex-start;gap:3px'}, qtyEl, qtyUnitLbl)),
      h('td', {class: 'n'}, h('div', {style: 'display:flex;align-items:center;justify-content:flex-start;gap:3px'}, prixHTEl, priceUnitLbl)),
      costTd,
      manual ? h('td', {class: 'n'}, h('button', {class: 's d', onclick: () => { row.tr.remove(); estRows.splice(estRows.indexOf(row), 1); calcEstTotal(); }}, '✕')) : h('td', {}));
    return row;
  }

  // ── rebuildEstimation ────────────────────────────────────────────
  let rebuildRunning = false;
  let rebuildPending = false;
  function calcEstTotal() {
    let tot = 0, missing = 0;
    for (const row of estRows) {
      const pid = row.productEl.value;
      const p = prods.find(x => String(x.id) === pid);
      const qkg = Number(row.qtyEl.value) || 0;
      const price = Number(row.prixHTEl.value) || (p ? (historicalPrices[String(p.id)] ?? p.unit_price) : null);
      if (price != null && qkg > 0) {
        const c = qkg * price;
        tot += c;
        row.costTd.textContent = eur(c);
      } else {
        row.costTd.textContent = '—';
        if (qkg > 0) missing++;
      }
    }
    estTotalBox.textContent = eur(tot);
    estUnpricedBox.textContent = missing ? `(${missing} ingrédient(s) sans prix)` : '';
  }

  async function rebuildEstimation() {
    if (rebuildRunning) { rebuildPending = true; return; }   // un appel pendant un rechargement est rejoué, pas perdu
    const lockIfView = () => { if (mopts.viewOnly) subTabContent.querySelectorAll('input,select,textarea,button').forEach(e => { e.disabled = true; }); };
    rebuildRunning = true;
    try {
      const nb_mat = Number(hdr.mat && hdr.mat.value) || 0;
      const nb_elem = Number(hdr.elem && hdr.elem.value) || 0;
      const nb_adu = Number(hdr.adu && hdr.adu.value) || 0;
      const allItems = [];
      for (const cat of MEAL_CATS) {
        const sel = menuSels[cat];
        if (!sel || !sel.recipeSel.value) continue;
        const detail = await getRecipeDetail(sel.recipeSel.value);
        if (!detail || !detail.items) continue;
        for (const it of detail.items) {
          const qg = (it.qty_maternelle || 0) * nb_mat + (it.qty_elementaire || 0) * nb_elem + (it.qty_adulte || 0) * nb_adu;
          // Determine unit type from grammage row to avoid always dividing by 1000
          const allGramRows = getGrammageRows();
          const gRow = allGramRows.find(g => g.label === (it.intitule_gemrcn || it.label));
          // Quantité À COMMANDER = quantité à servir × coefficient cru/cuit du grammage
          // (pièces à l'unité : pas de coefficient, la quantité à commander = quantité à servir)
          const coeff = gRow ? (Number(gRow.coeff) || 1) : 1;
          let qkg;
          let unit;
          if (gRow && gRow.unit) {
            // 'unité' type — qg is a count, not grams
            qkg = qg;
            unit = 'unité';
          } else if (gRow && (String(gRow.cgrs[0]).match(/l$/i) || String(gRow.cgrs[1]).match(/l$/i) || String(gRow.cgrs[2]).match(/l$/i))) {
            // Volume type (litres) — parseCgrsValGlobal already returns litres
            qkg = qg * coeff;
            unit = 'l';
          } else {
            // Default: grams → kg
            qkg = qg * coeff / 1000;
            unit = 'kg';
          }
          // Auto-match product: look up by product_id first, else try label fuzzy match
          let matchProd = it.product_id ? prods.find(x => String(x.id) === String(it.product_id)) : null;
          if (!matchProd && it.label) {
            const lbl = (it.label || '').toLowerCase();
            matchProd = prods.find(p => p.name.toLowerCase().includes(lbl) || lbl.includes(p.name.toLowerCase()));
          }
          if (!qkg && (Number(it.qty_commander) > 0 || Number(it.qty_servi) > 0)) {
            // pas de grammage par personne sur cet ingrédient : on repart de sa « Qté à commander »
            // (à défaut de sa « Qté à servir » × coefficient cru/cuit), au prorata des convives du repas
            const refGuests = (Number(detail.nb_maternelles) || 0) + (Number(detail.nb_elementaires) || 0) + (Number(detail.nb_adultes) || 0);
            const mealGuests = nb_mat + nb_elem + nb_adu;
            const ratio = refGuests > 0 && mealGuests > 0 ? mealGuests / refGuests : 1;
            const base = Number(it.qty_commander) > 0 ? Number(it.qty_commander) : Number(it.qty_servi) * coeff;
            const u = (it.unit || 'kg').trim().toLowerCase();
            if (u === 'g') { qkg = base / 1000 * ratio; unit = 'kg'; }
            else { qkg = base * ratio; unit = it.unit || 'kg'; }
          }
          // Produit lié au grammage GEMRCN : on garde ses grammages par personne
          // (servent au bouton « ↻ Recalculer les quantités »)
          if (gRow && it.intitule_gemrcn) {
            const gm = parseCgrsValGlobal(gRow.cgrs[0]), ge = parseCgrsValGlobal(gRow.cgrs[1]), ga = parseCgrsValGlobal(gRow.cgrs[2]);
            if (gm != null || ge != null || ga != null) it.gem = {mat: gm, elem: ge, adu: ga, coeff: Number(gRow.coeff) || 1};
          }
          const price = matchProd ? (historicalPrices[String(matchProd.id)] ?? matchProd.unit_price) : null;
          allItems.push({cat, label: it.label || (matchProd && matchProd.name) || it.product_name || '', product_id: matchProd ? matchProd.id : null, qkg, price, unit, gem: it.gem || null});
        }
      }

      let manualRows = estRows.filter(r => r._manual);
      if (!manualRows.length && savedEst && !savedEstRestored) {
        // premier affichage : restauration des lignes ajoutées à la main et enregistrées (une seule fois)
        for (const e of savedEst.filter(x => x.manual)) {
          const r = addEstRow({cat: e.cat, label: e.label, qkg: e.qty, price: e.price, unit: e.unit}, null, true);
          if (e.product_id != null) r.productEl.setValue(String(e.product_id));
          manualRows.push(r);
        }
      }
      savedEstRestored = true;
      if (!allItems.length) {
        // aucune recette liée : les lignes ajoutées à la main sont conservées sous le message
        estRows = [];
        for (const r of manualRows) estRows.push(r);   // …et restent référencées dans estRows (sinon perdues au prochain rebuild)
        const trs = manualRows.map(r => r.tr);   // lignes manuelles seules, sans message d'aide
        estTbody.replaceChildren(...trs);
        calcEstTotal();
      } else {
        // Rebuild estRows preserving existing user overrides (produit/prix/qté).
        // Correspondance par catégorie + libellé (insensible à l'ordre : lier une nouvelle recette
        // dans une autre catégorie ne décale rien) ; repli par position uniquement pour les libellés vides.
        // Au premier affichage, les lignes sans saisie sont restaurées depuis l'estimation enregistrée.
        const prevByKey = {};
        const prevByIndex = [];
        estRows.filter(r => !r._manual).forEach((r, i) => {
          prevByIndex[i] = r;
          if (r._label) prevByKey[estLblKey(r._cat, r._label)] = r;
        });
        const savedByKey = {};
        const savedByIndex = [];
        (savedEst || []).filter(x => !x.manual).forEach((e, i) => {
          savedByIndex[i] = e;
          if (e.label) savedByKey[estLblKey(e.cat, e.label)] = e;
        });

        estRows = [];
        const trs = allItems.map((it, i) => {
          let prev = it.label ? prevByKey[estLblKey(it.cat, it.label)] : null;
          if (!prev && !it.label && prevByIndex[i] && prevByIndex[i]._label === '') prev = prevByIndex[i];
          if (!prev) {
            const se = it.label ? savedByKey[estLblKey(it.cat, it.label)]
              : (savedByIndex[i] && savedByIndex[i].label === '' ? savedByIndex[i] : null);
            prev = savedEstPrev(se);
          }
          return addEstRow(it, prev).tr;
        });
        for (const r of manualRows) { estRows.push(r); trs.push(r.tr); }   // lignes ajoutées à la main : conservées telles quelles
        estTbody.replaceChildren(...trs);
        calcEstTotal();
      }

      // Produit rattaché dans l'Estimation (choix manuel prioritaire sur celui de la recette)
      const estPick = {};
      for (const r of estRows) { if (r.productEl.value) estPick[estLblKey(r._cat, r._label)] = r.productEl.value; }
      // Recale le Bilan sur l'estimation : met à jour produit/quantités des lignes non modifiées à la main,
      // ajoute les nouvelles, et ne touche jamais aux lignes que l'utilisateur a saisies lui-même.
      const aggregated = new Map();
      for (const it of allItems) {
        const key = bilanKey(it.product_id, it.label);
        const cur = aggregated.get(key);
        if (cur) cur.qkg += it.qkg;
        else aggregated.set(key, {...it, key});
      }
      const byKey = new Map(bilanRows.map(r => [r.key, r]));
      // Quantités affichées dans l'Estimation : le Bilan suit ces valeurs validées,
      // pas les quantités recalculées en arrière-plan à partir des convives.
      const estQty = {};
      for (const r of estRows) { const q = numOrNull(r.qtyEl.value); if (!r._manual && q != null && q > 0) estQty[estLblKey(r._cat, r._label)] = q; }
      // Lignes ajoutées à la main dans l'Estimation : créées dans le Bilan si absentes
      const manualDone = new Set();
      for (const r of manualRows) {
        const pid = numOrNull(r.productEl.value);
        const q = numOrNull(r.qtyEl.value);
        const key = bilanKey(pid, '');
        if (!pid || !q || byKey.has(key) || bilanDismissed.has(key)) continue;
        const p = prods.find(x => String(x.id) === String(pid));
        addBilanRow({product_id: pid, label: '', qty: q, unit: r.qtyUnitLbl.value || (p && p.unit) || 'kg', prix_reel: null});
        manualDone.add(key);
      }
      for (const [key, it] of aggregated) {
        if (manualDone.has(key)) continue;   // déjà ajouté depuis une ligne manuelle
        const estPid = estPick[estLblKey(it.cat, it.label)] || (it.product_id != null ? String(it.product_id) : '');
        // la ligne du Bilan est retrouvée par n'importe laquelle de ses clés successives :
        // libellé seul ('l:…'), puis produit ('p:…') une fois qu'on lui a rattaché un produit
        const labelKey = bilanKey(null, it.label);
        const prodKey = estPid ? bilanKey(numOrNull(estPid), '') : null;
        const row = byKey.get(key) || (prodKey && byKey.get(prodKey)) || byKey.get(labelKey);
        const dismissed = bilanDismissed.has(key) || (prodKey && bilanDismissed.has(prodKey)) || bilanDismissed.has(labelKey);
        if (row) {
          // ligne déjà présente : recalée sur l'estimation, sauf saisie manuelle
          if (!row.touched) {
            row._syncing = true;   // le recalage automatique ne marque pas la ligne « modifiée à la main »
            try {
              if (estPid && row.productEl.value !== estPid) {
                row.productEl.setValue(estPid);
                const p = prods.find(x => String(x.id) === estPid);
                if (p && p.unit) row.unitEl.value = p.unit;
              }
              const dispQty = estQty[estLblKey(it.cat, it.label)];
              const syncQty = dispQty != null ? dispQty : it.qkg;
              if (syncQty > 0) {
                row.qtyEl.value = syncQty.toFixed(3);
                if (it.unit) row.unitEl.value = it.unit;
              }
            } finally { row._syncing = false; }
          }
        } else if (!dismissed) {
          const dispQty = estQty[estLblKey(it.cat, it.label)];
          const syncQty = dispQty != null ? dispQty : it.qkg;
          const prow = addBilanRow({product_id: estPid ? Number(estPid) : it.product_id, label: it.label, qty: syncQty > 0 ? syncQty : null, unit: it.unit, prix_reel: null});
          if (!estPid) prow.touched = false;   // sans produit connu : la ligne reste recalable tant qu'elle n'est pas éditée
        }
      }
      calcBilanTotal();
    } finally { rebuildRunning = false; lockIfView(); if (rebuildPending) { rebuildPending = false; rebuildEstimation(); } }
  }

  // ── Sub-tab system ───────────────────────────────────────────────
  const SUBTABS = [
    {key: 'menu', label: '🗒 Menu', content: tab1Content},
    {key: 'estimation', label: '💰 Estimation des coûts', content: tab2Content},
    {key: 'bilan', label: '📋 Bilan', content: tab3Content},
  ];
  let activeSubTab = 'menu';
  const subTabBar = h('div', {style: 'display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap'});
  const subTabContent = h('div', {});

  const drawSubTabs = () => {
    subTabBar.replaceChildren(...SUBTABS.map(st => h('button', {
      'data-nolock': true,
      style: 'border:none;border-bottom:3px solid ' + (activeSubTab === st.key ? 'var(--acc)' : 'transparent') + ';border-radius:0;background:transparent;padding:10px 18px;font-size:14px;font-weight:' + (activeSubTab === st.key ? '600' : '400') + ';color:' + (activeSubTab === st.key ? 'var(--acc)' : 'var(--mute)') + ';margin-bottom:-2px;cursor:pointer',
      onclick: () => { activeSubTab = st.key; drawSubTabs(); if (st.key === 'estimation' || st.key === 'bilan') rebuildEstimation(); }
    }, st.label)));
    subTabContent.replaceChildren(SUBTABS.find(st => st.key === activeSubTab).content);
    // Après « ✏️ Modifier » (bascule sans recharger) : un onglet visité avant la bascule
    // est resté verrouillé car absent de l'écran au moment du déverrouillage.
    if (!mopts.viewOnly) subTabContent.querySelectorAll('input,select,textarea,button').forEach(e => { e.disabled = false; });
  };
  drawSubTabs();

  const body = h('div', {}, headerSection, subTabBar, subTabContent);
  upd();
  refreshPrices();

  const doSave = canWrite() ? async () => {
    if (!hdr.date.value) throw new Error('Indiquez le jour');
    const items = bilanRows
      .map(row => ({product_id: numOrNull(row.productEl.value), qty: numOrNull(row.qtyEl.value), unit: row.unitEl.value.trim() || null, prix_reel: numOrNull(row.prixReelEl.value)}))
      .filter(i => i.product_id && i.qty);
    const data = {
      date: hdr.date.value,
      nb_maternelles: Number(hdr.mat.value) || 0,
      nb_elementaires: Number(hdr.elem.value) || 0,
      nb_adultes: Number(hdr.adu.value) || 0,
      modif_prevu: modifCb.checked,
      statut: finaliseCb.checked ? 'passe' : 'en_cours',
      entree: menuSels.entree.dishInp.value.trim() || null,
      plat: menuSels.plat.dishInp.value.trim() || null,
      accompagnement: menuSels.accompagnement.dishInp.value.trim() || null,
      laitage: menuSels.laitage.dishInp.value.trim() || null,
      dessert: menuSels.dessert.dishInp.value.trim() || null,
      commentaire_post: commentairePost.value.trim() || null,
      recipe_entree: numOrNull(menuSels.entree.recipeSel.value),
      recipe_plat: numOrNull(menuSels.plat.recipeSel.value),
      recipe_accompagnement: numOrNull(menuSels.accompagnement.recipeSel.value),
      recipe_laitage: numOrNull(menuSels.laitage.recipeSel.value),
      recipe_dessert: numOrNull(menuSels.dessert.recipeSel.value),
      estimation: estRows.map(r => ({cat: r._cat, label: r._label, product_id: numOrNull(r.productEl.value),
        qty: numOrNull(r.qtyEl.value), price: numOrNull(r.prixHTEl.value), unit: r.qtyUnitLbl.value || null, manual: !!r._manual})),
      items
    };
    await api(m.id ? '/meals/' + m.id : '/meals', {method: m.id ? 'PUT' : 'POST', body: data});
    if (pageWrap) { const fresh = await pageMeals(); pageWrap.replaceChildren(...fresh.childNodes); }
  } : null;
  mopts.saveHandler = doSave;
  modal(m.id ? 'Repas du ' + dfr(m.date) : 'Nouveau repas', body, (canWrite() && !mopts.viewOnly) ? doSave : null, mopts);
}

/* ---------- Recettes ---------- */
const recipeView = {q: '', cat: ''};
async function pageRecettes() {
  const recipes = await api('/recipes').catch(() => []);
  const list = Array.isArray(recipes) ? recipes : (recipes.items || []);
  const cats = [...new Set(list.map(r => r.categorie).filter(Boolean))].sort(cmp);
  const q = h('input', {placeholder: 'Rechercher une recette…', value: recipeView.q, style: 'min-width:200px'});
  const fc = select([['', 'Toutes les catégories'], ...MEAL_CATS.map(c => [c, MEAL_CATS_LABELS[c]])], recipeView.cat);
  const tb = h('tbody');
  const draw = () => {
    recipeView.q = q.value; recipeView.cat = fc.value;
    const t = q.value.toLowerCase();
    const vis = list.filter(r => (!t || (r.name||'').toLowerCase().includes(t)) && (!fc.value || r.categorie === fc.value));
    // tri : entrée, plat, accompagnement, laitage, dessert, puis alphabétique (recettes sans catégorie en dernier)
    const catRank = c => { const i = MEAL_CATS.indexOf(c); return i === -1 ? MEAL_CATS.length : i; };
    vis.sort((a, b) => catRank(a.categorie) - catRank(b.categorie) || cmp(a.name || '', b.name || ''));
    tb.replaceChildren(...vis.map(r => {
      const tr = h('tr', {class: 'clickable'},
        h('td', {}, h('b', {}, r.name)),
        h('td', {}, r.categorie ? MEAL_CATS_LABELS[r.categorie] || r.categorie : ''),
        h('td', {class: 'n'},
          h('button', {class: 'icon-btn', title: 'Modifier', onclick: e => { e.stopPropagation(); loadAndEditRecipe(r.id); }}, '✏️'),
          canWrite() ? h('button', {class: 'icon-btn d', title: 'Supprimer', onclick: e => { e.stopPropagation(); confirmDel(`Supprimer la recette "${r.name}" ?`, () => api('/recipes/' + r.id, {method: 'DELETE'}))(); }}, '🗑️') : null));
      tr.addEventListener('click', () => loadAndEditRecipe(r.id));
      return tr;
    }));
  };
  for (const c of [q, fc]) c.addEventListener('input', draw);
  draw();
  return h('div', {},
    h('div', {class: 'tools'}, h('h2', {}, 'Recettes'), h('div', {class: 'ctl'}, q, fc,
      canWrite() ? h('button', {class: 'p', onclick: () => recipeForm({name: '', items: []})}, '+ Recette') : null)),
    h('div', {class: 'card tablewrap'}, list.length
      ? h('table', {},
          h('thead', {}, h('tr', {}, ['Nom', 'Catégorie', ''].map(x => h('th', {}, x)))),
          tb)
      : h('div', {class: 'empty'}, 'Aucune recette. Créez-en une avec "+ Recette".')));
}

// Recalcule les quantités figées d'une recette à partir des grammages courants
// (défauts + surcharges par label). Si le libellé CGRS n'existe plus, les valeurs stockées sont conservées.
function recomputeRecipeItems(recipe) {
  if (!recipe || !Array.isArray(recipe.items)) return recipe;
  const nbMat = Number(recipe.nb_maternelles) || 0;
  const nbElem = Number(recipe.nb_elementaires) || 0;
  const nbAdu = Number(recipe.nb_adultes) || 0;
  const principal = recipe.items.find(it => it.principal && it.intitule_gemrcn);
  if (!principal) return recipe;
  const gRow = getGrammageRows().find(g => g.label === principal.intitule_gemrcn);
  if (!gRow) return recipe;
  const gMat = parseCgrsValGlobal(gRow.cgrs[0]) || 0;
  const gElem = parseCgrsValGlobal(gRow.cgrs[1]) || 0;
  const gAdu = parseCgrsValGlobal(gRow.cgrs[2]) || 0;
  principal.qty_maternelle = gMat;
  principal.qty_elementaire = gElem;
  principal.qty_adulte = gAdu;
  const total = gMat * nbMat + gElem * nbElem + gAdu * nbAdu;
  // Ingrédients secondaires : même logique proportionnelle que recipeForm (au moment de l'enregistrement)
  if (total > 0) {
    // Même formule que recipeForm : part du total × 1000 / effectif, soit des grammes par personne
    const perPerson = (qServi, g, n) => n > 0 ? Math.round(qServi * (g * n) / total / n * 1000 * 10) / 10 : null;
    for (const it of recipe.items) {
      if (it.principal) continue;
      const qServi = Number(it.qty_servi) || 0;
      if (qServi <= 0) continue;
      it.qty_maternelle = perPerson(qServi, gMat, nbMat);
      it.qty_elementaire = perPerson(qServi, gElem, nbElem);
      it.qty_adulte = perPerson(qServi, gAdu, nbAdu);
    }
  }
  return recipe;
}

async function loadAndEditRecipe(id) {
  const recipe = recomputeRecipeItems(await api('/recipes/' + id));
  recipeForm(recipe);
}

async function recipeForm(r, onSavedCb = null) {
  await loadGramRows();   // grammages (et coefficients cru/cuit) depuis la base
  // r: {id?, name, categorie, items: [{product_id, label, qty_maternelle, qty_elementaire, qty_adulte}]}
  const nameInp = h('input', {value: r.name || '', placeholder: 'Nom de la recette *'});
  const catSel = select([['', '— aucune catégorie —'], ...MEAL_CATS.map(c => [c, MEAL_CATS_LABELS[c]])], r.categorie || '');

  // Reference convive counts for this recipe
  const nbMatInp  = h('input', {type: 'number', min: 0, step: 1, value: r.nb_maternelles  ?? (r.id ? 0 : CONVIVES_DEF.mat), style: 'width:80px'});
  const nbElemInp = h('input', {type: 'number', min: 0, step: 1, value: r.nb_elementaires ?? (r.id ? 0 : CONVIVES_DEF.elem), style: 'width:80px'});
  const nbAduInp  = h('input', {type: 'number', min: 0, step: 1, value: r.nb_adultes      ?? (r.id ? 0 : CONVIVES_DEF.adu), style: 'width:80px'});

  // Grammage rows flat list — filtered by recipe category
  const gramRows = getGrammageRows();
  const _beefIdx    = gramRows.findIndex(g => g.label.startsWith('Bœuf braisé'));
  const _fromageIdx = gramRows.findIndex(g => g.label === 'Fromages');
  function getFilteredGramRowsByCat(cat) {
    if (!cat || _beefIdx < 0) return gramRows;
    if (cat === 'entree') return gramRows.slice(0, _beefIdx);
    if (cat === 'plat' || cat === 'accompagnement') return gramRows.slice(_beefIdx, _fromageIdx >= 0 ? _fromageIdx : gramRows.length);
    if (cat === 'laitage' || cat === 'dessert') return _fromageIdx >= 0 ? gramRows.slice(_fromageIdx) : gramRows;
    return gramRows;
  }
  function getCurrentGramOpts() {
    return [['', '— sélectionner un intitulé CGRS —'], ...getFilteredGramRowsByCat(catSel.value)
      .map((g, i) => [String(i), g.label])
      .filter(([, l]) => l.length > 1 && !/^\*+$/.test(l.trim()))];
  }
  let filteredGramRows = getFilteredGramRowsByCat(r.categorie || '');

  const tb = h('tbody');
  let principalTr = null; // track which row is principal

  // Recalcule Qté à servir / Qté à commander de l'ingrédient principal à partir
  // de son intitulé CGRS et des convives de référence (appelé quand l'un change).
  const recalcPrincipalQtys = (initial = false) => {
    for (const tr of tb.children) {
      const it = tr._it;
      if (!it || !it.principalCb.checked) continue;
      if (it.gramSel.value === '') return;
      const gRow = filteredGramRows[Number(it.gramSel.value)];
      if (!gRow) return;
      const nbMat  = Number(nbMatInp.value)  || 0;
      const nbElem = Number(nbElemInp.value) || 0;
      const nbAdu  = Number(nbAduInp.value)  || 0;
      const gMat  = parseCgrsValGlobal(gRow.cgrs[0]) || 0;
      const gElem = parseCgrsValGlobal(gRow.cgrs[1]) || 0;
      const gAdu  = parseCgrsValGlobal(gRow.cgrs[2]) || 0;
      const total = gMat * nbMat + gElem * nbElem + gAdu * nbAdu;
      const isUnit = !!gRow.unit;
      const isLitre = !isUnit && [0, 1, 2].some(i => String(gRow.cgrs[i]).toLowerCase().includes('l'));
      const unit = isUnit ? 'unité' : (isLitre ? 'l' : 'kg');
      // Qté à servir : grammage net × convives. Qté à commander : à servir × coefficient cru/cuit.
      const coeff = Number(gRow.coeff) || 1;
      const value = isUnit ? Math.round(total) : (isLitre ? total.toFixed(3) : (total / 1000).toFixed(3));
      const toBuy = total * coeff;
      const valueCmd = isUnit ? Math.ceil(toBuy) : (isLitre ? toBuy.toFixed(3) : (toBuy / 1000).toFixed(3));
      // Unité : on respecte l'unité enregistrée à l'ouverture, sinon celle du grammage
      const keepSavedUnit = initial && it.origIt && it.origIt.unit;
      if (!keepSavedUnit) {
        for (const sel of [it.unitLbl, it.unitLbl2]) {
          if (![...sel.options].some(o => o.value === unit)) sel.add(new Option(unit, unit));
          sel.value = unit;
        }
      }
      it.qServiInp.value = value;
      it.qCommanderInp.value = valueCmd;
      // Avertissement : intitulé sans grammage pour une catégorie de convives active
      const missing = [
        nbMat > 0 && parseCgrsValGlobal(gRow.cgrs[0]) == null && 'maternelles',
        nbElem > 0 && parseCgrsValGlobal(gRow.cgrs[1]) == null && 'élémentaires',
        nbAdu > 0 && parseCgrsValGlobal(gRow.cgrs[2]) == null && 'adultes',
      ].filter(Boolean);
      if (it.gramHint) {
        it.gramHint.textContent = missing.length
          ? '⚠ Pas de grammage recommandé pour les ' + missing.join(' et les ') + ' — exclu du calcul' : '';
      }
      return;
    }
  };

  // Changer les convives de référence recalcule les quantités de l'ingrédient principal
  [nbMatInp, nbElemInp, nbAduInp].forEach(inp => inp.addEventListener('input', recalcPrincipalQtys));

  const makeIngredientRow = (it = {}) => {
    const isPrincipal = !!it.principal;
    const principalCb = h('input', {type: 'checkbox', checked: isPrincipal, title: 'Ingrédient principal'});

    // Grammage label dropdown (shown only when principal is checked)
    // Pre-select by matching stored label to gramRows
    let initGramIdx = '';
    if (isPrincipal && (it.intitule_gemrcn || it.label)) {
      const idx = filteredGramRows.findIndex(g => g.label === (it.intitule_gemrcn || it.label));
      if (idx >= 0) initGramIdx = String(idx);
    }
    const gramSel = select(getCurrentGramOpts(), initGramIdx, {style: 'min-width:260px'});
    const gramHint = h('small', {class: 'hint'});
    const gramWrap = h('div', {style: isPrincipal ? '' : 'display:none'}, gramSel, gramHint);

    // Label input (shown when NOT principal)
    const labelInp = h('input', {value: it.label || '', placeholder: 'Libellé libre', style: 'width:160px'});

    // Quantities: qServi (total to serve) and qCommander (total to order)
    const qServiInp    = h('input', {type: 'number', step: 'any', min: 0, value: it.qty_servi    ?? '', placeholder: '—', style: 'width:72px', title: 'Quantité totale à servir'});
    const qCommanderInp = h('input', {type: 'number', step: 'any', min: 0, value: it.qty_commander ?? '', placeholder: '—', style: 'width:72px', title: 'Quantité totale à commander'});
    // Unité éditable (une seule pour les deux quantités de la ligne)
    const UNIT_CHOICES = ['kg', 'g', 'l', 'cl', 'ml', 'unité', 'colis', 'botte', 'barquette', 'bidon', 'boite'];
    const initUnit = it.unit || it.product_unit || 'kg';
    if (!UNIT_CHOICES.includes(initUnit)) UNIT_CHOICES.push(initUnit);
    const makeUnitSel = () => h('select', {style: 'width:72px', title: 'Unité'},
      UNIT_CHOICES.map(u => h('option', {value: u, selected: u === initUnit}, u)));
    const unitLbl = makeUnitSel();
    const unitLbl2 = makeUnitSel();
    // Les deux sélecteurs d'unité de la ligne restent synchronisés
    unitLbl.addEventListener('change', () => { unitLbl2.value = unitLbl.value; });
    unitLbl2.addEventListener('change', () => { unitLbl.value = unitLbl2.value; });

    // When principal checkbox changes: enforce only one principal
    principalCb.addEventListener('change', () => {
      if (principalCb.checked) {
        // Uncheck all others
        for (const otr of tb.children) {
          if (otr !== tr && otr._it && otr._it.principalCb.checked) {
            otr._it.principalCb.checked = false;
            otr._it.gramWrap.style.display = 'none';
          }
        }
        gramWrap.style.display = '';
      } else {
        gramWrap.style.display = 'none';
      }
    });

    // When grammage selection changes: update unit label + auto-calc qServi/qCommander
    gramSel.addEventListener('change', () => {
      if (gramSel.value === '') return;
      recalcPrincipalQtys();
    });

    const tr = h('tr', {},
      h('td', {style: 'text-align:center'}, principalCb),
      h('td', {}, labelInp),
      h('td', {}, gramWrap),
      h('td', {class: 'n'}, h('div', {style: 'display:flex;align-items:center;gap:4px'}, qServiInp, unitLbl)),
      h('td', {class: 'n'}, h('div', {style: 'display:flex;align-items:center;gap:4px'}, qCommanderInp, unitLbl2)),
      h('td', {}, h('button', {class: 's d', onclick: () => tr.remove()}, '✕')));
    tr._it = {principalCb, gramSel, gramWrap, gramHint, labelInp, qServiInp, qCommanderInp, unitLbl, unitLbl2, origIt: it};
    return tr;
  };

  catSel.addEventListener('change', () => {
    filteredGramRows = getFilteredGramRowsByCat(catSel.value);
    const newOpts = getCurrentGramOpts();
    for (const tr of tb.children) {
      const it = tr._it;
      if (!it || !it.gramSel) continue;
      const prevVal = it.gramSel.value;
      it.gramSel.replaceChildren(...newOpts.map(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; return o; }));
      it.gramSel.value = prevVal;
      if (it.gramSel.value !== prevVal) it.gramSel.value = '';
    }
  });
  const addRow = (it = {}) => tb.append(makeIngredientRow(it));

  // Rebuild existing items: detect principal from it.principal flag or first item with gramSel
  (r.items && r.items.length ? r.items : [{}]).forEach(it => addRow(it));
  // Recalcule les quantités de l'ingrédient principal avec le grammage CGRS actuel
  recalcPrincipalQtys(true);

  const body = h('div', {},
    h('div', {class: 'f', style: 'margin-bottom:12px'},
      field('Nom *', nameInp),
      field('Catégorie', catSel)),
    h('div', {class: 'card', style: 'margin-bottom:12px;padding:12px 16px'},
      h('div', {style: 'font-weight:600;font-size:13px;color:var(--acc);margin-bottom:8px'}, '👥 Nombre de convives de référence pour cette recette'),
      h('div', {style: 'display:flex;gap:20px;flex-wrap:wrap;align-items:center'},
        h('label', {style: 'display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)'}, h('span', {}, 'Maternelles'), nbMatInp),
        h('label', {style: 'display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)'}, h('span', {}, 'Élémentaires'), nbElemInp),
        h('label', {style: 'display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)'}, h('span', {}, 'Adultes'), nbAduInp))),
    h('h3', {}, 'Ingrédients'),
    h('p', {class: 'mute', style: 'margin-top:0;font-size:13px'}, 'Cochez "Principal" sur l\'ingrédient principal : choisissez son intitulé CGRS pour récupérer automatiquement les grammages. Les ingrédients secondaires utilisent les quantités totales à servir/commander.'),
    h('div', {class: 'tablewrap'}, h('table', {},
      h('thead', {}, h('tr', {},
        h('th', {style: 'text-align:center;width:60px'}, 'Principal'),
        h('th', {}, 'Libellé'),
        h('th', {}, 'Intitulé grammage GEMRCN'),
        h('th', {style: 'text-align:left'}, 'Qté à servir'),
        h('th', {style: 'text-align:left'}, 'Qté à commander'),
        h('th', {}))),
      tb)),
    h('button', {style: 'margin-top:8px', onclick: () => addRow({})}, '+ Ingrédient'),
    r.served && r.served.length ? h('div', {style: 'margin-top:14px'},
      h('h3', {}, 'Servie les jours suivants'),
      h('div', {class: 'chips'}, r.served.map(s =>
        h('span', {class: 'pill', title: `${s.guests || 0} convive(s) · ${STATUT_LABELS[s.statut] || s.statut || ''}${s.plat ? ' · ' + s.plat : ''}`},
          dfr(s.date) + (s.guests ? ' · ' + s.guests + ' cv' : ''))))) : null);

  modal(r.id ? 'Recette : ' + r.name : 'Nouvelle recette', body, canWrite() ? async () => {
    if (!nameInp.value.trim()) throw new Error('Le nom est obligatoire');
    const nbMat  = Number(nbMatInp.value)  || 0;
    const nbElem = Number(nbElemInp.value) || 0;
    const nbAdu  = Number(nbAduInp.value)  || 0;

    // Find principal row to get per-person grams
    let principalGrams = null; // {gMat, gElem, gAdu}
    let principalTotal = 0;    // total grams for reference population
    for (const tr of tb.children) {
      const it = tr._it;
      if (!it || !it.principalCb.checked) continue;
      const idx = it.gramSel.value;
      if (idx !== '') {
        const gRow = filteredGramRows[Number(idx)];
        const gMat  = parseCgrsValGlobal(gRow.cgrs[0]) || 0;
        const gElem = parseCgrsValGlobal(gRow.cgrs[1]) || 0;
        const gAdu  = parseCgrsValGlobal(gRow.cgrs[2]) || 0;
        principalGrams = {gMat, gElem, gAdu};
        principalTotal = gMat * nbMat + gElem * nbElem + gAdu * nbAdu;
      }
      break;
    }

    const items = [...tb.children].map(tr => {
      const it = tr._it;
      if (!it) return null;
      // Le libellé est toujours celui saisi ; l'intitulé CGRS est stocké à part (intitule_gemrcn)
      const intitule = it.principalCb.checked && it.gramSel.value !== '' ? filteredGramRows[Number(it.gramSel.value)].label : null;
      const label = it.labelInp.value.trim() || intitule || null;
      if (!label) return null;
      const qServi    = Number(it.qServiInp.value)     || 0;
      const qCommander = Number(it.qCommanderInp.value) || 0;

      if (it.principalCb.checked && principalGrams) {
        // Per-person grams come from CGRS grammage table
        return {
          product_id: null,
          label,
          qty_maternelle:  principalGrams.gMat,
          qty_elementaire: principalGrams.gElem,
          qty_adulte:      principalGrams.gAdu,
          qty_servi:    qServi,
          qty_commander: qCommander,
          principal: true,
          intitule_gemrcn: intitule
        };
      } else {
        // Secondary: compute per-person proportionally from principal
        let qMat = null, qElem = null, qAdu = null;
        if (principalGrams && principalTotal > 0) {
          // Total for this secondary ingredient distributed proportionally
          qMat  = qServi > 0 ? qServi * (principalGrams.gMat  * nbMat)  / principalTotal : null;
          qElem = qServi > 0 ? qServi * (principalGrams.gElem * nbElem) / principalTotal : null;
          qAdu  = qServi > 0 ? qServi * (principalGrams.gAdu  * nbAdu)  / principalTotal : null;
          // Convert from total to per-person (divide by count)
          if (nbMat  > 0 && qMat  != null) qMat  = qMat  / nbMat  * 1000;  // g per person
          if (nbElem > 0 && qElem != null) qElem = qElem / nbElem * 1000;
          if (nbAdu  > 0 && qAdu  != null) qAdu  = qAdu  / nbAdu  * 1000;
        }
        return {
          product_id: null,
          label,
          qty_maternelle:  qMat  != null ? Math.round(qMat  * 10) / 10 : null,
          qty_elementaire: qElem != null ? Math.round(qElem * 10) / 10 : null,
          qty_adulte:      qAdu  != null ? Math.round(qAdu  * 10) / 10 : null,
          qty_servi:    qServi,
          qty_commander: qCommander,
          principal: false,
          intitule_gemrcn: null
        };
      }
    }).filter(Boolean);

    const data = {
      name: nameInp.value.trim(),
      categorie: catSel.value || null,
      description: null,
      nb_maternelles:  nbMat,
      nb_elementaires: nbElem,
      nb_adultes:      nbAdu,
      items
    };
    const res = await api(r.id ? '/recipes/' + r.id : '/recipes', {method: r.id ? 'PUT' : 'POST', body: data});

async function downloadBackup() {
  busy(true);
  try {
    const r = await fetch('/api/backup', {headers: {'X-Requested-With': 'cgrs'}, credentials: 'same-origin'});
    if (!r.ok) throw new Error('Erreur serveur ' + r.status);
    const disp = r.headers.get('Content-Disposition') || '';
    const m = disp.match(/filename="?([^";]+)"?/i);
    const name = m ? m[1] : 'cgrs_backup_' + new Date().toISOString().slice(0, 10) + '.zip';
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast('Sauvegarde téléchargée : ' + name);
  } catch (e) {
    alert('Sauvegarde impossible : ' + e.message);
  } finally { busy(false); }
}
async function restoreBackup(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (!confirm(`Restaurer « ${file.name} » ?\n\nToutes les données actuelles (fournisseurs, produits, réceptions, repas, stocks, utilisateurs…) seront remplacées par celles de la sauvegarde.`)) return;
  const fd = new FormData();
  fd.append('file', file);
  busy(true);
  try {
    const r = await api('/restore', {method: 'POST', body: fd});
    busy(false);
    alert(`Sauvegarde restaurée (${r.files} fichier(s) remis en place). Reconnectez-vous.`);
    location.reload();
  } catch (e) { busy(false); alert('Restauration impossible : ' + e.message); }
}

const GRAM_UNIT_RE = /à l'unité/;

function gramRowsFromData(data) {
  // Aplatit les données structurées en liste de lignes complètes : {label, gemrcn, cgrs, coeff, unit, section_*}
  const rows = [];
  for (const [sk, tab] of Object.entries(data)) {
    for (const sec of tab.sections) {
      for (const row of sec.rows) {
        rows.push({
          section_key: sk, section_label: tab.label, section_title: sec.title || null,
          label: row.label, gemrcn: row.gemrcn || [], cgrs: row.cgrs,
          coeff: row.coeff != null ? row.coeff : 1,
          unit: row.unit || (GRAM_UNIT_RE.test(row.label) ? 'unité' : null),
        });
      }
    }
  }
  // surcharges éventuelles non encore migrées en base
  for (const r of rows) {
    const ov = GRAM_OVERRIDES[r.label];
    if (ov) {
      if (Array.isArray(ov.cgrs)) r.cgrs = ov.cgrs.slice();
      if (ov.coeff != null) r.coeff = ov.coeff;
    }
  }
  return rows;
}

let GRAM_ROWS = null;   // grammages chargés depuis la base de données

async function loadGramRows() {
  if (GRAM_ROWS) return GRAM_ROWS;
  await loadGramOverrides();
  const builtin = gramRowsFromData(GRAMMAGES_DATA);
  try {
    const rows = await api('/grammages-rows');
    if (Array.isArray(rows) && rows.length) { GRAM_ROWS = rows; return GRAM_ROWS; }
    // Premier lancement : la base est vide, on y enregistre les valeurs par défaut
    GRAM_ROWS = builtin;
    api('/grammages-rows', {method: 'PUT', body: {rows: builtin.map(r => ({...r}))}}).catch(() => {});
  } catch (e) { GRAM_ROWS = builtin; }
  return GRAM_ROWS;
}

function getGrammageRows() {
  return GRAM_ROWS || gramRowsFromData(GRAMMAGES_DATA);
}

function parseCgrsValGlobal(s) {
  if (!s || s === '—') return null;
  const str = String(s).trim().replace(',', '.');
  const vol = str.match(/^(\d+(?:\.\d+)?)\s*(ml|cl|l)$/i);
  if (vol) {
    const n = parseFloat(vol[1]);
    const u = vol[2].toLowerCase();
    const factor = u === 'ml' ? 0.001 : u === 'cl' ? 0.01 : 1;
    return n * factor; // litres
  }
  if (/[a-zA-Z]/.test(str)) return null;
  const frac = str.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (frac) return parseFloat(frac[1]) / parseFloat(frac[2]);
  const n = parseFloat(str);
  return isNaN(n) ? null : n;
}

    return {val: isNaN(n) ? null : n, litre: false};
  }


  // ── Données chargées depuis la base de données ────────────────────────────
  await loadGramRows();
  const GRAMMAGES = {};
  for (const r of GRAM_ROWS) {
    let tab = GRAMMAGES[r.section_key];
    if (!tab) tab = GRAMMAGES[r.section_key] = {label: r.section_label || r.section_key, sections: []};
    let sec = tab.sections.find(s => (s.title || null) === (r.section_title || null));
    if (!sec) { sec = {title: r.section_title || null, rows: []}; tab.sections.push(sec); }
    sec.rows.push({label: r.label, gemrcn: r.gemrcn || [], cgrs: r.cgrs, coeff: r.coeff != null ? r.coeff : 1, unit: r.unit || undefined});
  }

  // ── Debounced save ─────────────────────────────────────────────────────────
  let _saveTimer = null;
  // Collecte toutes les lignes de grammages telles qu'affichées/éditées
  function collectGramRows() {
    const rows = [];
    for (const [sk, tab] of Object.entries(GRAMMAGES)) {
      for (const sec of tab.sections) {
        for (const row of sec.rows) {
          rows.push({section_key: sk, section_label: tab.label, section_title: sec.title || null,
            label: row.label, gemrcn: row.gemrcn || [], cgrs: row.cgrs.slice(),
            coeff: row.coeff != null ? row.coeff : 1, unit: row.unit || null});
        }
      }
    }
    return rows;
  }
  // Met à jour immédiatement le cache GRAM_ROWS (utilisé par Recettes et Repas), sans attendre la sauvegarde différée
  function syncOverridesNow() {
    GRAM_ROWS = collectGramRows();
  }
  function schedSave() {
    syncOverridesNow();
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(async () => {
      try {
        await api('/grammages-rows', {method: 'PUT', body: {rows: collectGramRows()}});
        toast('Grammages enregistrés ✓');
      } catch(e) { toast('Erreur sauvegarde grammages'); }
    }, 1400);
  }

  // Convives state
  let nbMat = CONVIVES_DEF.mat, nbElem = CONVIVES_DEF.elem, nbAdu = CONVIVES_DEF.adu;

  const note = h('div', {class: 'note'},
    '📋 Grammages recommandés par le GEMRCN et grammages appliqués par le CGRS (en grammes, sauf mention contraire). Tolérance ± 10 %.');

  // Convives inputs panel
  const inpMat  = h('input', {type:'number', min:'0', value: String(CONVIVES_DEF.mat), style:'width:70px;text-align:center', oninput: () => { nbMat  = parseInt(inpMat.value)||0;  updateTotal(); recalc(); }});
  const inpElem = h('input', {type:'number', min:'0', value: String(CONVIVES_DEF.elem), style:'width:70px;text-align:center', oninput: () => { nbElem = parseInt(inpElem.value)||0; updateTotal(); recalc(); }});
  const inpAdu  = h('input', {type:'number', min:'0', value: String(CONVIVES_DEF.adu), style:'width:70px;text-align:center', oninput: () => { nbAdu  = parseInt(inpAdu.value)||0;  updateTotal(); recalc(); }});
  const totalSpan = h('span', {style:'font-weight:600'}, String(nbMat + nbElem + nbAdu));
  function updateTotal() { totalSpan.textContent = nbMat + nbElem + nbAdu; }

  const convivesPanel = h('div', {class:'card', style:'display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:16px;padding:12px 16px'},
    h('span', {style:'font-weight:600;color:var(--acc)'}, '👥 Nombre de convives :'),
    h('label', {style:'display:flex;align-items:center;gap:6px'}, h('span', {}, 'Maternelles'), inpMat),
    h('label', {style:'display:flex;align-items:center;gap:6px'}, h('span', {}, 'Élémentaires'), inpElem),
    h('label', {style:'display:flex;align-items:center;gap:6px'}, h('span', {}, 'Adultes'), inpAdu),
    h('span', {style:'color:var(--muted);font-size:13px'}, 'Total : ', totalSpan, ' repas'));

  const tabs = Object.keys(GRAMMAGES);
  let active = tabs[0];
  const tabBar = h('div', {style: 'display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px'});
  const content = h('div', {});

  // Map of row td elements for live update: array of {tdServi, tdAcheter, row}
  let rowCells = [];

  function calcRow(row) {
    const mv = parseCgrsVal(row.cgrs[0]);
    const ev = parseCgrsVal(row.cgrs[1]);
    const av = parseCgrsVal(row.cgrs[2]);
    const isLitre = mv.litre || ev.litre || av.litre;
    const total = (mv.val !== null ? mv.val * nbMat : 0)
                + (ev.val !== null ? ev.val * nbElem : 0)
                + (av.val !== null ? av.val * nbAdu : 0);
    if (row.unit) {
      // pas de coefficient cru/cuit pour les pièces : la quantité à commander est la même que celle à servir
      return {servi: Math.round(total), achat: Math.round(total), isUnit: true};
    }
    if (isLitre) {
      return {servi: total, achat: total * (row.coeff || 1), isLitre: true};
    }
    const achat = (total / 1000) * (row.coeff || 1);
    return {servi: total, achat: achat};
  }

  function fmtServi(res) {
    if (nbMat + nbElem + nbAdu === 0) return '—';
    if (res.isUnit) return Math.round(res.servi) + ' unités';
    if (res.isLitre) return res.servi.toFixed(3) + ' l';
    return (res.servi / 1000).toFixed(3) + ' kg';
  }
  function fmtAchat(res) {
    if (nbMat + nbElem + nbAdu === 0) return '—';
    if (res.isUnit) return Math.round(res.achat) + ' unités';
    if (res.isLitre) return res.achat.toFixed(3) + ' l';
    return res.achat.toFixed(3) + ' kg';
  }

  function recalc() {
    for (const {tdServi, tdAcheter, row} of rowCells) {
      const res = calcRow(row);
      tdServi.textContent   = fmtServi(res);
      tdAcheter.textContent = fmtAchat(res);
    }
  }

  // Build an editable input for a CGRS cell or coeff cell
  function mkCgrsInput(row, idx) {
    const inp = h('input', {
      type: 'text',
      value: row.cgrs[idx],
      style: 'width:52px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-size:12px;background:var(--bg)'
    });
    inp.oninput = () => {
      row.cgrs[idx] = inp.value.trim();
      recalc();
      schedSave();
    };
    return inp;
  }

  function mkCoeffInput(row) {
    const inp = h('input', {
      type: 'number',
      step: '0.01',
      min: '0.01',
      value: row.coeff,
      style: 'width:58px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-size:12px;background:var(--bg)'
    });
    inp.oninput = () => {
      const v = parseFloat(inp.value);
      if (!isNaN(v) && v > 0) { row.coeff = v; recalc(); schedSave(); }
    };
    return inp;
  }

  const renderTab = () => {
    rowCells = [];
    const cat = GRAMMAGES[active];
    const sections = [];
    for (const sec of cat.sections) {
      if (sec.title) {
        sections.push(h('tr', {},
          h('td', {colspan: '11', style: 'background:var(--acc2);color:var(--acc);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)'}, sec.title)));
      }
      for (const row of sec.rows) {
        const unitTag = row.unit ? h('span', {class: 'pill', style: 'margin-left:4px;font-size:11px'}, row.unit) : null;
        const res = calcRow(row);
        const tdServi   = h('td', {class: 'n', style: 'border-left:2px solid var(--line);color:var(--acc);font-weight:500'}, fmtServi(res));
        const tdAcheter = h('td', {class: 'n', style: 'font-weight:600'}, fmtAchat(res));
        rowCells.push({tdServi, tdAcheter, row});
        sections.push(h('tr', {},
          h('td', {}, row.label, unitTag),
          h('td', {class: 'n'}, row.gemrcn[0]),
          h('td', {class: 'n'}, row.gemrcn[1]),
          h('td', {class: 'n'}, row.gemrcn[2]),
          h('td', {class: 'n', style: 'border-left:2px solid var(--line);padding:3px 6px'}, mkCgrsInput(row, 0)),
          h('td', {class: 'n', style: 'padding:3px 6px'}, mkCgrsInput(row, 1)),
          h('td', {class: 'n', style: 'padding:3px 6px'}, mkCgrsInput(row, 2)),
          h('td', {class: 'n', style: 'border-left:2px solid var(--line);padding:3px 6px'}, mkCoeffInput(row)),
          tdServi,
          tdAcheter));
      }
    }
    content.replaceChildren(
      h('div', {class: 'card tablewrap'},
        h('table', {},
          h('thead', {},
            h('tr', {},
              h('th', {style: 'min-width:220px'}, 'Produit'),
              h('th', {class: 'n', style: 'font-size:11px'}, 'GEMRCN Mat.'),
              h('th', {class: 'n', style: 'font-size:11px'}, 'GEMRCN Élém.'),
              h('th', {class: 'n', style: 'font-size:11px'}, 'GEMRCN Adulte'),
              h('th', {class: 'n', style: 'border-left:2px solid var(--line);font-size:11px'}, 'CGRS Mat.'),
              h('th', {class: 'n', style: 'font-size:11px'}, 'CGRS Élém.'),
              h('th', {class: 'n', style: 'font-size:11px'}, 'CGRS Adulte'),
              h('th', {class: 'n', style: 'border-left:2px solid var(--line);min-width:72px;font-size:11px'}, 'Coeff cru/cuit'),
              h('th', {class: 'n', style: 'border-left:2px solid var(--line);min-width:95px;color:var(--acc);font-size:11px'}, 'Qté à servir'),
              h('th', {class: 'n', style: 'min-width:90px;font-size:11px'}, 'Qté à acheter'))),
          h('tbody', {}, ...sections))));
  };

  const drawTabs = () => {
    tabBar.replaceChildren(...tabs.map(k =>
      h('button', {
        class: k === active ? 'p' : '',
        style: 'height:34px;padding:0 14px;font-size:14px',
        onclick: () => { active = k; drawTabs(); renderTab(); }
      }, GRAMMAGES[k].label)));
  };

  drawTabs();
  renderTab();

  return h('div', {},
    h('div', {class: 'tools'}, h('h2', {}, 'Grammages GEMRCN')),
    note,
    convivesPanel,
    tabBar,
    content);
}

/* ---------- navigation ---------- */
const PAGES = {
  stats: ['Statistiques', pageStats, ['admin', 'editor', 'reader', 'stats']],
  orders: ['Réceptions', pageOrders, ['admin', 'editor', 'reader']],
  suppliers: ['Fournisseurs', pageSuppliers, ['admin', 'editor', 'reader']],
  products: ['Produits', pageProducts, ['admin', 'editor', 'reader']],
  stocks: ['Stocks', pageStocks, ['admin', 'editor', 'reader']],
  recipes: ['Recettes', pageRecettes, ['admin', 'editor', 'reader']],
  meals: ['Repas', pageMeals, ['admin', 'editor', 'reader']],
  grammages: ['Grammages', pageGrammages, ['admin', 'editor', 'reader', 'stats']],
  settings: ['Paramètres', pageSettings, ['admin']],
};
const allowedPages = () => Object.entries(PAGES).filter(([, p]) => p[2].includes(state.user.role)).map(([k]) => k);

function renderShell() {
  $('#auth').hidden = true;
  $('#shell').hidden = false;
  $('#me').replaceChildren(
    h('span', {}, `${state.user.username} · ${(state.meta.roles[state.user.role] || '').split(' (')[0]}`),
    h('button', {class: 's', onclick: async () => { try { await api('/auth/logout', {method: 'POST', noRedirect: true}); } catch {} state.user = null; location.hash = ''; boot(); }}, 'Déconnexion'));
}
let renderSeq = 0;   // une page lente à charger ne doit pas écraser la page demandée ensuite (clics rapides sur le menu)
async function render() {
  if (!state.user) return;
  const ok = allowedPages();
  let key = location.hash.slice(1);
  if (!ok.includes(key)) key = ok[0];
  $('#nav').replaceChildren(...ok.map(k => h('a', {href: '#' + k, class: k === key ? 'on' : ''}, PAGES[k][0])));
  const seq = ++renderSeq;
  try { const page = await PAGES[key][1](); if (seq === renderSeq) $('#app').replaceChildren(page); }
  catch (e) { if (e.status !== 401 && seq === renderSeq) $('#app').replaceChildren(h('div', {class: 'card'}, 'Erreur : ' + e.message)); }
}
window.addEventListener('hashchange', render);
async function enter() { state.meta = await api('/meta'); await loadGramOverrides(); await loadGramRows(); try { CONVIVES_DEF = await api('/convives-defaults'); } catch (e) {} const a = $('#auth'); a.hidden = true; a.replaceChildren(); renderShell(); await render(); }
async function boot() {
  try {
    const st = await api('/auth/status', {noRedirect: true});
    if (st.user) { state.user = st.user; await enter(); }
    else showAuth(st.setup_needed);
  } catch (e) { $('#auth').hidden = false; $('#auth').replaceChildren(h('div', {class: 'authbox'}, h('div', {class: 'card'}, 'Impossible de joindre le serveur : ' + e.message))); }
}
boot();
</script>

<div id="pdf-viewer" hidden style="position:fixed;inset:0;z-index:1000;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto">
  <div style="background:var(--card);border-radius:14px;width:100%;max-width:1040px;height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden">
    <div style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)">
      <strong id="pdf-title"></strong>
      <div style="display:flex;gap:10px">
        <button onclick="closePdf()">✕ Fermer</button>
      </div>
    </div>
    <iframe id="pdf-frame" style="flex:1;border:0"></iframe>
  </div>
</div>
<script>
function openPdf(url, title) {
  document.getElementById('pdf-title').textContent = title || 'Document';
  document.getElementById('pdf-frame').src = url;
  document.getElementById('pdf-viewer').hidden = false;
}
function closePdf() {
  document.getElementById('pdf-frame').src = 'about:blank';   // libère le PDF
  document.getElementById('pdf-viewer').hidden = true;
}
document.getElementById('pdf-viewer').addEventListener('click', e => { if (e.target.id === 'pdf-viewer') closePdf(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('pdf-viewer').hidden) closePdf(); });
</script>
