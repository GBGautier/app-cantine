# =====================================================================================
# Docker Compose pour la production - CGRS - Réceptions & stocks
# =====================================================================================
# Ce fichier étend docker-compose.yml pour une configuration de production.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# =====================================================================================

version: '3.8'

services:
  # -----------------------------------------------------------------------------
  # Service principal de l'application (override pour la production)
  # -----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cgrs-app-prod
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=/app/data/cantine.db
      - UPLOADS_DIR=uploads
      - BACKUPS_DIR=sauvegardes-auto
      - STATIC_DIR=static
      # Clé secrète pour la production (à remplacer par une vraie clé)
      - SECRET_KEY=${SECRET_KEY:-production-secret-key-change-me}
      - SESSION_COOKIE_NAME=cgrs_session
      - LOG_LEVEL=WARNING
      - MAX_UPLOAD_SIZE=25
      # Activer HTTPS si derrière un reverse proxy
      - HTTPS_MODE=true
      # Origines CORS autorisées
      - CORS_ORIGINS=${CORS_ORIGINS:-https://cgrs.example.com,http://localhost:8000}
    volumes:
      # Persistance des données
      - cgrs-data:/app/data
    ports:
      - "8000:8000"
    networks:
      - cgrs-network
    # Commande pour la production (sans reload, avec plus de workers)
    command: >
      sh -c "uvicorn src.backend.app:app --host 0.0.0.0 --port 8000 --workers 4"
    # Limites de ressources
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # -----------------------------------------------------------------------------
  # Reverse Proxy Nginx (optionnel)
  # -----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cgrs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - cgrs-data:/app/data:ro
    depends_on:
      - app
    networks:
      - cgrs-network

  # -----------------------------------------------------------------------------
  # Service de sauvegarde automatique
  # -----------------------------------------------------------------------------
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cgrs-backup
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/cantine.db
      - BACKUPS_DIR=sauvegardes-auto
    volumes:
      - cgrs-data:/app/data
    networks:
      - cgrs-network
    # Commande pour créer une sauvegarde quotidienne
    command: >
      sh -c "while true; do \
        python -c \"from src.backend.routes.backup import create_backup; import asyncio; asyncio.run(create_backup({'username': 'backup', 'role': 'admin'}))\" && \
        sleep 86400; \
      done"
    # Planification via cron (alternative)
    # entrypoint: /bin/sh
    # command: >
    #   -c "echo '0 2 * * * python -c \"from src.backend.routes.backup import create_backup; import asyncio; asyncio.run(create_backup({'username': 'backup', 'role': 'admin'}))\"' > /etc/crontab && crond -f"

# -----------------------------------------------------------------------------
# Réseaux
# -----------------------------------------------------------------------------
networks:
  cgrs-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  cgrs-data:
    driver: local
